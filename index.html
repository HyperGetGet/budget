<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Budget Familial</title>

<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#14212e;--mut:#6b7c8d;--line:#e3e9ef;--acc:#0e9f6e;--bad:#d9382c;--warn:#d98a00;--blue:#2f6fed;--chip:#eef2f6;--hero1:#0f3a5a;--hero2:#0b7f58;--shadow:0 1px 3px rgba(15,40,60,.08),0 6px 18px rgba(15,40,60,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b141c;--card:#14212d;--ink:#e8eef4;--mut:#8da0b2;--line:#233444;--chip:#1c2d3b;--hero1:#0d2f49;--hero2:#0a6a4b;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:var(--hero1);color:#fff;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.hr{display:flex;gap:8px;align-items:center}
#sync{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
#sync.warn{background:#d98a00}#sync.bad{background:#b3382e}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero small{opacity:.85;font-size:13px}
.hero .big{font-size:40px;font-weight:700;margin:4px 0 2px;letter-spacing:-.5px}
.hero .big.neg{color:#ffb4ab}
.hero .sub{font-size:13px;opacity:.9}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.35;background:#fff3d6;color:#6b4a00}
.alert.bad{background:#fde1de;color:#7d1d14}
@media (prefers-color-scheme:dark){.alert{background:#3a2f12;color:#ffd98a}.alert.bad{background:#3d1a17;color:#ffb4ab}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.env{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.env .t{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.env .v{font-size:20px;font-weight:650;margin:4px 0 8px}
.bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.env .s{font-size:12px;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);flex:1;min-width:30%}
.chip b{display:block;font-size:17px}.chip span{font-size:12px;color:var(--mut)}
h2{font-size:15px;margin:18px 4px 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt span{font-size:12px;color:var(--mut)}
.am{font-weight:650;white-space:nowrap}.am.l{color:var(--blue)}
.day{font-size:12px;color:var(--mut);margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.4px}
.pend{opacity:.65}
.pill{font-size:11px;background:var(--chip);border-radius:99px;padding:2px 8px;color:var(--mut);margin-left:6px}
.paid .rt b{text-decoration:line-through;color:var(--mut)}
.tg{width:46px;height:26px;border-radius:99px;background:var(--chip);position:relative;flex:none;border:1px solid var(--line)}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.tg.on{background:var(--acc)}.tg.on:after{left:22px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:21px}nav button.on{color:var(--acc);font-weight:650}
#fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(14,159,110,.45);cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .2s;max-width:720px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=number]{font-family:inherit;width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:14px;cursor:pointer}
.cat.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:650;padding:14px;margin-top:16px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink);margin-top:8px}.btn.red{background:var(--bad)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:#14212e;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ldds{border-left:5px solid var(--blue);cursor:pointer}
.ldds .t{font-size:13px;color:var(--mut)}.ldds .big{font-size:28px;font-weight:700;color:var(--blue);margin:2px 0}
.ldds .s{font-size:13px;color:var(--mut);line-height:1.4}
.linkbtn{background:none;border:0;color:var(--blue);font-size:14px;padding:8px 0;cursor:pointer;text-align:left}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--chip);border-top-color:var(--acc);margin:18px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tl{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:6px}
.tl .row{padding:7px 0;font-size:14px}
.who{display:flex;gap:8px;margin-bottom:12px}.who .cat{flex:1;text-align:center;padding:10px 6px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 12px;text-align:center;cursor:pointer;border:0;color:var(--ink);font-size:14px;font-weight:600}
.tile span{display:block;font-size:30px;margin-bottom:6px}.tile small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:3px}
.tile.soon{opacity:.6}
.amz{display:flex;gap:6px;align-items:center}.amz .col{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);width:44px}
.pill.bad{background:var(--bad);color:#fff}.pill.ok{background:var(--acc);color:#fff}.pill.warn{background:var(--warn);color:#fff}
.soc{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.soc:last-child{border-bottom:0}
.soc .rt b{white-space:normal}
.empty{text-align:center;color:var(--mut);padding:30px 10px;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Budget Familial</h1>
  <div class="hr"><span id="sync">…</span><button class="ib" id="refresh" aria-label="Actualiser">⟳</button></div>
</header>
<main id="view"></main>
<button id="fab" aria-label="Ajouter une dépense">+</button>
<nav id="nav">
  <button data-tab="home"><span>🏠</span>Accueil</button>
  <button data-tab="journal"><span>📒</span>Journal</button>
  <button data-tab="annuels"><span>📅</span>Annuels</button>
  <button data-tab="plus"><span>☰</span>Plus</button>
</nav>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="scanFile" accept="image/*,application/pdf" style="display:none">

<script>
"use strict";
const APP_VERSION = "1.4.0";
const CATS = { "Courses": "🛒", "Animaux": "🐾", "Bébé": "🍼", "Loisirs": "🎉", "Véhicule": "⛽", "Hors budget": "📦" };
const ENVS = [["courses", "Courses", "🛒"], ["animaux", "Animaux", "🐾"], ["bebe", "Bébé", "🍼"], ["loisirs", "Loisirs", "🎉"], ["vehicule", "Véhicules", "⛽"]];
const CAT_ENV = { "Courses": "courses", "Animaux": "animaux", "Bébé": "bebe", "Loisirs": "loisirs", "Véhicule": "vehicule" };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const S = {
  tab: "home",
  cfg: LS.get("bf.cfg", { url: "", key: "" }),
  base: LS.get("bf.base", null),
  queue: LS.get("bf.queue", []),
  who: LS.get("bf.who", "Commun"), soFilter: "att", flushing: false, loading: false, offline: false, error: "", edit: null, form: null
};

// ---------- utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const eur = n => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(Number(n) || 0);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
function fmtDay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const t = todayISO();
  if (iso === t) return "Aujourd'hui";
  const dt = new Date(y, m - 1, d);
  const y1 = new Date(); y1.setDate(y1.getDate() - 1);
  if (iso === y1.getFullYear() + "-" + pad(y1.getMonth() + 1) + "-" + pad(y1.getDate())) return "Hier";
  return dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}
function fmtMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3200);
}
const saveCfg = () => LS.set("bf.cfg", S.cfg);
const saveBase = () => LS.set("bf.base", S.base);
const saveQueue = () => LS.set("bf.queue", S.queue);

// ---------- catégorie automatique (même règle que le Sheet) ----------
function categorize(lib) {
  const kws = (S.base && S.base.motsCles) || [];
  const mots = norm(lib).split(/[^a-z0-9]+/).filter(Boolean);
  let best = null;
  kws.forEach(([k, c]) => {
    const ws = norm(k).split(/[^a-z0-9]+/).filter(Boolean);
    if (!ws.length) return;
    const ok = ws.every(w => mots.some(m => m.indexOf(w) === 0 || (w.length >= 5 && m.indexOf(w) !== -1)));
    if (!ok) return;
    const score = ws.length * 1000 + ws.join("").length;
    if (!best || score > best.score) best = { score, cat: c };
  });
  return best ? best.cat : null;
}
function parseQuick(text) {
  const m = String(text).trim().match(/^(.*?)[\s:=-]+(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur|euros|e)?$/i);
  if (!m) return null;
  return { lib: m[1].trim(), mont: parseFloat(m[2].replace(",", ".")) };
}

// ---------- état affiché = état du Sheet + opérations en attente ----------
function computeView() {
  if (!S.base) return null;
  const v = JSON.parse(JSON.stringify(S.base));
  S.queue.forEach(op => applyOp(v, op));
  return v;
}
function shift(v, cat, mont, ldds, sign) {
  if (ldds) return;
  const k = CAT_ENV[cat];
  if (k && v.enveloppes[k]) { v.enveloppes[k].restant -= sign * mont; v.enveloppes[k].depense += sign * mont; }
  else { v.totaux.horsBudget += sign * mont; v.totaux.budgetRestant -= sign * mont; }
  v.totaux.soldeTheorique -= sign * mont;
}
function applyOp(v, op) {
  const p = op.payload;
  if (op.type === "add" && isPerso(p.qui)) { persoAdd(v, p.qui, p.cat, p.lib, p.mont, p.date, op.id); }
  else if (op.type === "del" && isPerso(p.qui)) { persoDel(v, p.qui, p.lib, p.mont); }
  else if (op.type === "add") {
    v.journal.unshift({ date: p.date, lib: p.lib, mont: p.mont, cat: p.cat, ldds: p.ldds === true, pending: op.id });
    shift(v, p.cat, p.mont, p.ldds === true, 1);
    if (p.ldds === true) lddsMove(v, -p.mont);
  } else if (op.type === "del") {
    const i = v.journal.findIndex(j => j.date === p.date && j.lib === p.lib && Math.abs(j.mont - p.mont) < .005 && j.ldds === (p.ldds === true));
    if (i >= 0) { v.journal.splice(i, 1); shift(v, p.cat, p.mont, p.ldds === true, -1); if (p.ldds === true) lddsMove(v, p.mont); }
  } else if (op.type === "plein") {
    const c = fuelCalc(p);
    if (c.l > 0 && c.p > 0) {
      if (!v.vehicule) v.vehicule = { pleins: [], kmActuel: 0, payeurs: ["Commun", "Mathilde", "Gaétan"], types: ["Plein", "Complément"] };
      v.vehicule.pleins.unshift({ date: todayISO(), litres: c.l, prix: c.p, km: p.km, qui: p.qui, prixL: c.q, conso: null, dist: null, type: p.type, pending: op.id });
      v.vehicule.kmActuel = Math.max(v.vehicule.kmActuel || 0, p.km);
      if (p.qui === "Commun") {
        v.journal.unshift({ date: todayISO(), lib: "Plein SEAT", mont: c.p, cat: "Véhicule", ldds: false, pending: op.id });
        shift(v, "Véhicule", c.p, false, 1);
      }
    }
  } else if (op.type === "ticket") {
    const m = Number(p.total) || 0;
    if (m > 0 && isPerso(p.qui)) { persoAdd(v, p.qui, p.cat, p.magasin || "Ticket", m, p.date, op.id); }
    else if (m > 0) {
      v.journal.unshift({ date: p.date, lib: p.magasin || "Ticket", mont: m, cat: p.cat, ldds: false, pending: op.id });
      shift(v, p.cat, m, false, 1);
    }
  } else if (op.type === "soin") { soinApply(v, p, op.id);
  } else if (op.type === "soindel") { if (v.soins) v.soins.liste = v.soins.liste.filter(x => x.id !== p.soinId);
  } else if (op.type === "entree") { entreeApply(v, p);
  } else if (op.type === "amazon") { amzApply(v, p);
  } else if (op.type === "ldds") {
    if (v.ldds) {
      const old = v.ldds.soldeEstime != null ? v.ldds.soldeEstime : v.ldds.soldeReel;
      v.ldds.soldeFinMois += p.mont - old; v.ldds.soldeEstime = p.mont; v.ldds.soldeReel = p.mont; v.ldds.releveLe = todayISO();
    }
  } else if (op.type === "solde") {
    v.totaux.soldeTheorique = p.mont; v.previsionnel.soldeReel = p.mont;
  } else if (op.type === "annuel") {
    const a = v.annuels.find(x => x.row === p.row && x.lib === p.lib) || v.annuels.find(x => x.lib === p.lib && Math.abs(x.mont - p.mont) < .005 && x.paye !== p.paye);
    if (a && a.paye !== p.paye) {
      a.paye = p.paye; a.datePaye = p.paye ? todayISO() : "";
      v.totaux.soldeTheorique += (p.paye ? -1 : 1) * a.mont;
      v.totaux.ldds += (p.paye ? 1 : -1) * a.mont;
      if (v.ldds && v.ldds.soldeEstime != null) v.ldds.soldeEstime -= (p.paye ? 1 : -1) * a.mont;
    }
  }
}

// ---------- carburant ----------
function num(x) {
  if (x === null || x === undefined || String(x).trim() === "") return null;
  const n = parseFloat(String(x).replace(/\s/g, "").replace(",", ".").replace(/[^\d.\-]/g, ""));
  return isNaN(n) ? null : n;
}
// 2 valeurs sur 3 suffisent : la troisième est calculée
function fuelCalc(f) {
  let l = num(f.litres), p = num(f.prix), q = num(f.prixL), calc = "";
  if (l !== null && p !== null) { if (q === null && l > 0) { q = p / l; calc = "q"; } }
  else if (l !== null && q !== null) { p = Math.round(l * q * 100) / 100; calc = "p"; }
  else if (p !== null && q !== null && q > 0) { l = Math.round(p / q * 100) / 100; calc = "l"; }
  else { l = null; p = null; q = null; }
  return { l, p, q, calc };
}
const f2 = n => (Math.round(n * 100) / 100).toFixed(2).replace(".", ",");

// ---------- réseau ----------
async function call(action, payload, ms) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const res = await fetch(S.cfg.url, {
      method: "POST", redirect: "follow", signal: ctrl.signal,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ key: S.cfg.key, action }, payload || {}))
    });
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new Error("réponse inattendue du Sheet"); }
    return data;
  } finally { clearTimeout(to); }
}
const configured = () => !!(S.cfg.url && S.cfg.key);

async function refresh(silent) {
  if (!configured()) return;
  if (S.queue.length) { return flush(); }
  S.loading = true; setSync();
  try {
    const r = await call("state");
    if (r.ok) { S.base = r.state; saveBase(); S.offline = false; S.error = ""; }
    else { S.error = r.error; if (!silent) toast("⚠ " + r.error); }
  } catch (e) { S.offline = true; if (!silent) toast("Hors connexion : données du dernier chargement"); }
  S.loading = false; setSync(); render();
}

async function flush() {
  if (S.flushing || !configured()) return;
  S.flushing = true; setSync();
  try {
    while (S.queue.length) {
      const op = S.queue[0];
      const r = await call(op.type, Object.assign({}, op.payload, { id: op.id }));
      if (r.ok) {
        S.queue.shift(); saveQueue();
        if (S.queue.length === 0) { S.base = r.state; saveBase(); }
        S.offline = false; S.error = "";
      } else if (r.error === "clé invalide" || /code de l'appli/.test(r.error)) {
        S.error = r.error; toast("🔐 Code incorrect : vérifie les Réglages"); break;
      } else {
        S.queue.shift(); saveQueue(); toast("Refusé par le Sheet : " + r.error);
      }
    }
    if (!S.queue.length && !S.error) { const r2 = await call("state"); if (r2.ok) { S.base = r2.state; saveBase(); } }
  } catch (e) { S.offline = true; }
  S.flushing = false; setSync(); render();
}

function enqueue(type, payload) {

function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => rej(new Error("image illisible"));
    im.src = u;
  });
}
function fileB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("lecture du fichier impossible")); r.readAsDataURL(file); });
}
async function filePayload(file) {
  if (file.type === "application/pdf") {
    if (file.size > 7 * 1024 * 1024) throw new Error("PDF trop lourd (7 Mo maximum)");
    return { mime: "application/pdf", data: await fileB64(file) };
  }
  const im = await loadImage(file);
  const k = Math.min(1, 2400 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return { mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
}
async function scanTicket(file) {
  if (!file) return;
  if (!navigator.onLine || S.offline) { toast("Il faut du réseau pour lire un ticket"); return; }
  openSheet(`<h3>📷 Lecture du ticket…</h3><div class="spin"></div><div class="hint" style="text-align:center">Gemini analyse l'image, quelques secondes.</div>`);
  try {
    const pl = await filePayload(file);
    const r = await call("scan", pl, 70000);
    if (!r.ok) throw new Error(r.error || "lecture impossible");
    openTicket(r.ticket);
  } catch (e) {
    closeSheet();
    toast("⚠ " + (e.name === "AbortError" ? "Gemini met trop de temps, réessaie" : e.message));
  }
}
function guessTicketCat(t) {
  let c = categorize(t.magasin || "");
  if (c) return { cat: c, auto: true };
  const n = {};
  (t.lignes || []).forEach(l => { const x = categorize(l.lib); if (x) n[x] = (n[x] || 0) + 1; });
  const best = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  return best ? { cat: best, auto: true } : { cat: "Hors budget", auto: false };
}

  openSheet(`<h3>⛽ Plein de carburant</h3>
    <div class="hint">Remplis 2 valeurs sur 3 : la troisième se calcule toute seule.</div>
    <div class="two"><div><label>Litres</label><input type="text" id="vL" inputmode="decimal" value="${esc(f.litres)}" autocomplete="off"></div>
    <div><label>Prix payé (€)</label><input type="text" id="vP" inputmode="decimal" value="${esc(f.prix)}" autocomplete="off"></div></div>
    <label>Prix au litre (€/L)</label><input type="text" id="vQ" inputmode="decimal" value="${esc(f.prixL)}" autocomplete="off">
    <div class="hint" id="vCalc"></div>
    <label>Kilométrage au compteur${last ? " · dernier : " + last.toLocaleString("fr-FR") + " km" : ""}</label><input type="text" id="vK" inputmode="numeric" value="${esc(f.km)}" autocomplete="off">
    <label>Payé par</label>
    <div class="cats" id="vQui">${payeurs.map(x => `<button type="button" class="cat ${f.qui === x ? "on" : ""}" data-qui="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <label>Type</label>
    <div class="cats" id="vType">${["Plein", "Complément"].map(x => `<button type="button" class="cat ${f.type === x ? "on" : ""}" data-type="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="hint">Enregistré à la date du jour.</div>
    <button class="btn" id="vSave">Enregistrer le plein</button>
    <button class="linkbtn" id="vBack">Autre dépense véhicule (entretien, péage…)</button>`);
  setTimeout(() => { const t = $("#vL"); if (t) t.focus(); }, 250);
  updateFuelCalc();
}
function updateFuelCalc() {
  const f = S.form; if (!f || f.vmode !== "fuel") return;
  const c = fuelCalc(f), el = $("#vCalc"); if (!el) return;
  el.textContent = c.calc === "q" ? `→ ${f2(c.q)} €/L` : c.calc === "p" ? `→ ${f2(c.p)} €` : c.calc === "l" ? `→ ${f2(c.l)} L` : "";
}
function saveFuel() {
  const f = S.form, c = fuelCalc(f), km = num(f.km);
  if (!(c.l > 0) || !(c.p > 0)) { toast("Indique 2 valeurs parmi litres, prix et prix au litre"); return; }
  if (!(km > 0)) { toast("Indique le kilométrage"); return; }
  const v = computeView(); const last = (v && v.vehicule && v.vehicule.kmActuel) || 0;
  if (last && km <= last && !confirm("Ce kilométrage (" + km + ") n'est pas supérieur au dernier plein (" + last + "). Enregistrer quand même ?")) return;
  LS.set("bf.qui", f.qui);
  enqueue("plein", { litres: num(f.litres), prix: num(f.prix), prixL: num(f.prixL), km, qui: f.qui, type: f.type });
  closeSheet(); toast("✔ Plein enregistré");
}
function openLdds() {
  const v = computeView();
  openSheet(`<h3>Solde réel du LDDS</h3>
    <div class="hint">Saisis le solde affiché par ta banque maintenant. Le solde estimé baisse ensuite tout seul avec tes dépenses amorties et tes prélèvements payés.</div>
    <label>Solde LDDS (€)</label><input type="text" id="lMont" inputmode="decimal" value="${esc(v && v.ldds && v.ldds.soldeReel ? String(v.ldds.soldeReel).replace(".", ",") : "")}" autocomplete="off">
    <button class="btn" id="lSave">Enregistrer</button>`);
  setTimeout(() => { const t = $("#lMont"); if (t) { t.focus(); t.select(); } }, 250);
}

function openAdd(prefill) {
  S.form = Object.assign({ text: "", mont: "", cat: "", manualCat: false, ldds: false, date: todayISO(), qui: S.who }, prefill || {});
  const f = S.form;
  openSheet(`<h3>${S.edit ? "Modifier la dépense" : "Nouvelle dépense"}</h3>${S.edit ? "" : addModeChips("depense")}
    ${S.edit ? "" : `<button type="button" class="btn sec" id="scanBtn" style="margin:0 0 6px">📷 Scanner un ticket</button>`}
    <label>Qu'as-tu dépensé ? (ex. « Leclerc 45 »)</label>
    <input type="text" id="fText" value="${esc(f.text)}" autocomplete="off" autocapitalize="sentences">
    <label>Montant (€)</label><input type="text" id="fMont" inputmode="decimal" value="${esc(f.mont)}" autocomplete="off">
    <label>Catégorie <span id="fAuto" class="hint"></span></label>
    <div class="cats" id="fCats">${Object.keys(CATS).map(c => `<button type="button" class="cat ${f.cat === c ? "on" : ""}" data-cat="${esc(c)}">${CATS[c]} ${esc(c)}</button>`).join("")}</div>
    <button type="button" class="linkbtn" id="fFuelBtn" style="display:none">⛽ C'est un plein ? Saisir litres, km, qui a payé…</button>
    <label>Date</label><input type="date" id="fDate" value="${esc(f.date)}">
    ${S.edit ? "" : `<label>Payé par</label>` + payerChips("fQui", f.qui, "data-payer")}
    <div class="line" id="fLddsLine" style="${f.qui !== "Commun" ? "display:none" : ""}"><div><b>💙 Amorti par le LDDS</b><div class="hint">Visible, mais hors budget du mois</div></div><div class="tg ${f.ldds ? "on" : ""}" id="fLdds"></div></div>
    <button class="btn" id="fSave">Enregistrer</button>
    ${S.edit ? `<button class="btn sec red" id="fDel" style="color:#fff">Supprimer</button>` : ""}`);
  setTimeout(() => { const t = $("#fText"); if (t && !S.edit) t.focus(); }, 250);
  updateAuto();
}
function openSolde() {
  const v = computeView();
  openSheet(`<h3>Solde réel du compte commun</h3>
    <div class="hint">Saisis le solde affiché par ta banque maintenant. Le solde théorique repart de ce chiffre.</div>
    <label>Solde réel (€)</label><input type="text" id="sMont" inputmode="decimal" value="${esc(v ? String(v.previsionnel.soldeReel).replace(".", ",") : "")}" autocomplete="off">
    <button class="btn" id="sSave">Enregistrer</button>`);
  setTimeout(() => { const t = $("#sMont"); if (t) { t.focus(); t.select(); } }, 250);
}
function updateAuto() {
  const f = S.form; if (!f) return;
  const q = parseQuick(f.text);
  const lib = q ? q.lib : f.text.trim();
  let note = "";
  if (!f.manualCat && lib) {
    const c = categorize(lib);
    f.cat = c || (lib ? "Hors budget" : "");
    note = c ? "· détectée" : "· mot inconnu → hors budget";
  }
  document.querySelectorAll("#fCats .cat").forEach(b => b.classList.toggle("on", b.dataset.cat === f.cat));
  const a = $("#fAuto"); if (a) a.textContent = note;
  const fb = $("#fFuelBtn"); if (fb) fb.style.display = (f.cat === "Véhicule" && !S.edit) ? "block" : "none";
}
function saveForm() {
  const f = S.form;
  let lib = f.text.trim(), mont = parseFloat(String(f.mont).replace(",", ".").replace(/[^\d.]/g, ""));
  const q = parseQuick(f.text);
  if (q && !(mont > 0)) { lib = q.lib; mont = q.mont; }
  else if (q && String(f.mont).trim() === "") { lib = q.lib; mont = q.mont; }
  if (!lib || !(mont > 0)) { toast("Indique un libellé et un montant"); return; }
  const qui = S.edit ? "Commun" : (f.qui || "Commun");
  const payload = { date: f.date || todayISO(), lib, mont: Math.round(mont * 100) / 100, cat: f.cat || "Hors budget", ldds: qui === "Commun" && f.ldds === true, qui };
  if (S.edit) deleteItem(S.edit, true);
  enqueue("add", payload);
  closeSheet(); toast("✔ Enregistré");
}
function deleteItem(j, silent) {
  const pend = j.pending && S.queue.findIndex(o => o.id === j.pending);
  if (j.pending && pend >= 0) { S.queue.splice(pend, 1); saveQueue(); render(); setSync(); }
  else enqueue("del", { date: j.date, lib: j.lib, mont: j.mont, cat: j.cat, ldds: j.ldds === true });
  if (!silent) { closeSheet(); toast("Supprimé"); }
}

// ---------- événements ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-act]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.who) { setWho(t.dataset.who); return; }
  if (t.dataset.addmode) { if (t.dataset.addmode === "entree") openEntree(); else openAdd(); return; }
  if (t.dataset.act === "goso") { S.tab = "soins"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "soinnew") { openSoin(); return; }
  if (t.dataset.act === "entreenew") { openEntree(); return; }
  if (t.dataset.act === "soinrow") { openSoinDetail(t.dataset.id); return; }
  if (t.dataset.filt) { S.soFilter = t.dataset.filt; render(); return; }
  if (t.dataset.spour) { S.form.pour = t.dataset.spour; document.querySelectorAll("#sPour .cat").forEach(b => b.classList.toggle("on", b.dataset.spour === S.form.pour)); return; }
  if (t.dataset.spay) { S.form.payePar = t.dataset.spay; document.querySelectorAll("#sPay .cat").forEach(b => b.classList.toggle("on", b.dataset.spay === S.form.payePar)); return; }
  if (t.dataset.ecat) { S.form.cat = t.dataset.ecat; document.querySelectorAll("#eCats .cat").forEach(b => b.classList.toggle("on", b.dataset.ecat === S.form.cat)); $("#eSoWrap").style.display = S.form.cat === "Soin" ? "" : "none"; return; }
  if (t.dataset.eorg) { S.form.org = t.dataset.eorg; document.querySelectorAll("#eOrg .cat").forEach(b => b.classList.toggle("on", b.dataset.eorg === S.form.org)); renderESoins(); return; }
  if (t.dataset.ecompte) { S.form.compte = t.dataset.ecompte; document.querySelectorAll("#eCompte .cat").forEach(b => b.classList.toggle("on", b.dataset.ecompte === S.form.compte)); return; }
  if (t.dataset.eso) { toggleESoin(t.dataset.eso); return; }
  if (t.id === "sSave") { saveSoin(); return; }
  if (t.id === "eSave") { saveEntree(); return; }
  if (t.id === "dRemb") { const id = S.form.id; openEntree({ cat: "Soin" }); toggleESoin(id); return; }
  if (t.id === "dDel") {
    if (!confirm("Supprimer ce soin du suivi (et de l'onglet Soins du Sheet) ?")) return;
    const id = S.form.id, pend = S.queue.findIndex(o => o.id === id && o.type === "soin");
    if (pend >= 0) { S.queue.splice(pend, 1); saveQueue(); render(); setSync(); } else enqueue("soindel", { soinId: id });
    closeSheet(); toast("Soin supprimé"); return;
  }
  if (t.dataset.payer) { S.form.qui = t.dataset.payer; document.querySelectorAll("#fQui .cat").forEach(b => b.classList.toggle("on", b.dataset.payer === S.form.qui)); const l = $("#fLddsLine"); if (l) l.style.display = S.form.qui === "Commun" ? "flex" : "none"; return; }
  if (t.dataset.tqui) { S.form.qui = t.dataset.tqui; document.querySelectorAll("#tQui .cat").forEach(b => b.classList.toggle("on", b.dataset.tqui === S.form.qui)); return; }
  if (t.dataset.act === "goplus") { S.tab = "plus"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "goamz") { S.tab = "amazon"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "goreg") { S.tab = "reglages"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "soon") { toast((t.dataset.n || "Cette section") + " : prévu dans une prochaine version"); return; }
  if (t.dataset.act === "pitem") {
    const v = computeView(); const P = v.perso && v.perso[S.who]; const e = P && P.entrees[Number(t.dataset.i)]; if (!e) return;
    if (confirm("Supprimer « " + e.lib + " » (" + eur(e.mont) + ") de l'onglet " + S.who + " ?")) {
      const pend = e.pending && S.queue.findIndex(o => o.id === e.pending);
      if (e.pending && pend >= 0) { S.queue.splice(pend, 1); saveQueue(); render(); setSync(); }
      else enqueue("del", { qui: S.who, lib: e.lib, mont: e.mont, cat: e.cat, date: todayISO(), ldds: false });
    }
    return;
  }
  if (t.dataset.act === "amz") {
    const on = !t.classList.contains("on"), prix = Number(t.dataset.prix) || 0;
    enqueue("amazon", { bloc: t.dataset.bloc, groupe: t.dataset.g, lib: t.dataset.lib, prix, mont: on ? prix : 0 }); return;
  }
  if (t.dataset.act === "amzedit") { openAmzItem(t.dataset.g, t.dataset.lib, Number(t.dataset.prix) || 0); return; }
  if (t.dataset.act === "amzadd") { openAmzItem(t.dataset.g, "", 0); return; }
  if (t.dataset.act === "amzjour") { openAmzJour(t.dataset.bloc); return; }
  if (t.id === "aSave") { saveAmzItem(); return; }
  if (t.id === "aDel") { if (confirm("Retirer cet article de la liste Amazon ?")) { enqueue("amazon", { groupe: S.form.g, lib: S.form.lib, suppr: true }); closeSheet(); } return; }
  if (t.id === "jSave") {
    const j = parseInt($("#jJ").value, 10);
    if (!(j >= 1 && j <= 31)) { toast("Indique un jour entre 1 et 31"); return; }
    enqueue("amazon", { bloc: S.form.bloc, jour: j }); closeSheet(); toast("✔ Jour de débit enregistré"); return;
  }
  if (t.id === "fab") { S.edit = null; openAdd(); return; }
  if (t.id === "refresh") { if (S.queue.length) flush(); else refresh(); return; }
  if (t.id === "fSave") { saveForm(); return; }
  if (t.id === "fDel") { if (confirm("Supprimer cette dépense ?")) deleteItem(S.edit); return; }
  if (t.dataset.cat) {
    if (t.dataset.cat === "Véhicule" && !S.edit) { openFuel(); return; }
    S.form.cat = t.dataset.cat; S.form.manualCat = true; updateAuto(); return;
  }
  if (t.id === "fFuelBtn") { openFuel(); return; }
  if (t.id === "scanBtn") { $("#scanFile").click(); return; }
  if (t.id === "tSave") { saveTicket(); return; }
  if (t.dataset.tcat) { S.form.cat = t.dataset.tcat; document.querySelectorAll("#tCats .cat").forEach(b => b.classList.toggle("on", b.dataset.tcat === S.form.cat)); return; }
  if (t.id === "vBack") { openAdd({ cat: "Véhicule", manualCat: true }); return; }
  if (t.id === "vSave") { saveFuel(); return; }
  if (t.dataset.qui) { S.form.qui = t.dataset.qui; document.querySelectorAll("#vQui .cat").forEach(b => b.classList.toggle("on", b.dataset.qui === S.form.qui)); return; }
  if (t.dataset.type) { S.form.type = t.dataset.type; document.querySelectorAll("#vType .cat").forEach(b => b.classList.toggle("on", b.dataset.type === S.form.type)); return; }
  if (t.dataset.act === "fuel") { openFuel(); return; }
  if (t.dataset.act === "ldds") { openLdds(); return; }
  if (t.id === "lSave") {
    const m = parseFloat(String($("#lMont").value).replace(/\s/g, "").replace(",", "."));
    if (isNaN(m)) { toast("Indique un montant"); return; }
    enqueue("ldds", { mont: Math.round(m * 100) / 100 }); closeSheet(); toast("✔ Solde LDDS mis à jour"); return;
  }
  if (t.id === "cfgSave") { saveCfgFromForm(); return; }
  if (t.id === "cfgReload") { reloadApp(); return; }
  if (t.dataset.act === "solde") { openSolde(); return; }
  if (t.id === "sSave") {
    const m = parseFloat(String($("#sMont").value).replace(/\s/g, "").replace(",", "."));
    if (isNaN(m)) { toast("Indique un montant"); return; }
    enqueue("solde", { mont: Math.round(m * 100) / 100 }); closeSheet(); toast("✔ Solde réel mis à jour"); return;
  }
  if (t.dataset.act === "item") {
    const v = computeView(); const j = v.journal[Number(t.dataset.i)]; if (!j) return;
    S.edit = j; openAdd({ text: j.lib, mont: String(j.mont).replace(".", ","), cat: j.cat, manualCat: true, ldds: j.ldds, date: j.date }); return;
  }
  if (t.dataset.act === "annuel") {
    const paye = !t.querySelector(".tg").classList.contains("on");
    enqueue("annuel", { row: Number(t.dataset.row), lib: t.dataset.lib, mont: Number(t.dataset.mont), paye });
    return;
  }
});
document.addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); if (e.target.id === "fLdds") { S.form.ldds = !S.form.ldds; e.target.classList.toggle("on", S.form.ldds); } if (e.target.id === "aC" || e.target.id === "aS") e.target.classList.toggle("on");
  if (e.target.id === "sNR") { S.form.nonremb = !S.form.nonremb; e.target.classList.toggle("on", S.form.nonremb); ["sS", "sA"].forEach(i => { const x = $("#" + i); if (x) { x.disabled = S.form.nonremb; if (S.form.nonremb) x.value = ""; } }); }
  if (e.target.id === "sDep") { S.form.depense = !S.form.depense; e.target.classList.toggle("on", S.form.depense); } });
document.addEventListener("input", e => {
  if (!S.form || S.form.vmode === "amz" || S.form.vmode === "amzj" || S.form.vmode === "soind") return;
  if (S.form.vmode === "soin" || S.form.vmode === "entree") { handleFormInput(e); return; }
  if (e.target.id === "fText") { S.form.text = e.target.value; updateAuto(); }
  if (e.target.id === "fMont") S.form.mont = e.target.value;
  if (e.target.id === "fDate") S.form.date = e.target.value;
  const tk = { tM: "magasin", tD: "date", tT: "total" }[e.target.id];
  if (tk) { S.form[tk] = e.target.value; return; }
  const fk = { vL: "litres", vP: "prix", vQ: "prixL", vK: "km" }[e.target.id];
  if (fk) { S.form[fk] = e.target.value; updateFuelCalc(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "scanFile") { const f = e.target.files && e.target.files[0]; e.target.value = ""; scanTicket(f); }
});

async function saveCfgFromForm() {
  S.cfg.url = $("#cfgUrl").value.trim(); S.cfg.key = $("#cfgKey").value.trim(); saveCfg();
  if (!configured()) { toast("Renseigne l'adresse et le code"); return; }
  try {
    const r = await call("state");
    if (r.ok) { S.base = r.state; saveBase(); S.offline = false; S.error = ""; toast("✔ Connecté au Sheet"); S.tab = "home"; }
    else toast("⚠ " + r.error);
  } catch (e) { toast("Impossible de joindre le script : vérifie l'adresse"); }
  setSync(); render();
}
async function reloadApp() {
  try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); const ks = await caches.keys(); for (const k of ks) await caches.delete(k); } catch (e) {}
  location.reload();
}

// ---------- démarrage ----------
(function init() {
  // lien de configuration : #u=<url>&k=<code>
  if (location.hash.length > 2) {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get("u") && p.get("k")) { S.cfg = { url: p.get("u"), key: p.get("k") }; saveCfg(); history.replaceState(null, "", location.pathname); toast("Connexion configurée"); }
  }
  setSync(); render();
  if (configured()) { S.queue.length ? flush() : refresh(true); }
  window.addEventListener("online", () => { S.offline = false; flush(); refresh(true); });
  window.addEventListener("offline", () => { S.offline = true; setSync(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && configured()) { S.queue.length ? flush() : refresh(true); } });
  setInterval(() => { if (!document.hidden && configured() && navigator.onLine) { S.queue.length ? flush() : refresh(true); } }, 90000);
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
})();
</script>
</body>
</html>
