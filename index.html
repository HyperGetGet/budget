<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3870">
<meta name="mobile-web-app-capable" content="yes">
<title>Maison &amp; Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0e1318;--card:#18212a;--ink:#eef2f5;--mut:#9daab6;--line:#26313b;--acc:#f2b33d;--onacc:#0e1318;--bad:#ff8674;--warn:#ff9f43;--blue:#6fc3ff;--chip:#222d38;--hero1:#0e1318;--hero2:#18212a;--shadow:none;--num:"Space Grotesk",Inter,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.hr{display:flex;gap:8px;align-items:center}
#sync{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
#sync.warn{background:var(--warn);color:var(--onacc);border-color:var(--warn)}#sync.bad{background:var(--bad);color:var(--onacc);border-color:var(--bad)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:11px;font-size:17px;cursor:pointer}#prof{color:var(--acc);font-family:var(--num);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{background:none;color:var(--ink);padding:10px 4px 6px;margin-bottom:14px}
.hero small{color:var(--mut);font-size:13px}
.hero .big{font-family:var(--num);font-size:50px;font-weight:700;margin:6px 0 8px;letter-spacing:-1.5px;line-height:1;color:var(--acc)}
.hero .big.neg{color:var(--bad)}
.hero .sub{font-size:13px;color:var(--mut)}.hero .sub b{color:var(--ink);font-weight:600}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.35;background:#3a2f12;color:#ffd98a}
.alert.bad{background:#3d1a17;color:#ffb4ab}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.env{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.env .t{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.env .v{font-family:var(--num);font-size:20px;font-weight:700;margin:4px 0 8px}
.bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.env .s{font-size:12px;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);flex:1;min-width:30%}
.chip b{display:block;font-family:var(--num);font-size:17px}.chip span{font-size:12px;color:var(--mut)}
h2{font-size:13px;margin:20px 4px 8px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt span{font-size:12px;color:var(--mut)}
.am{font-family:var(--num);font-weight:700;white-space:nowrap}.am.l{color:var(--blue)}
.day{font-size:12px;color:var(--mut);margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.4px}
.pend{opacity:.65}
.pill{font-size:11px;background:var(--chip);border-radius:99px;padding:2px 8px;color:var(--mut);margin-left:6px}
.paid .rt b{text-decoration:line-through;color:var(--mut)}
.tg{width:46px;height:26px;border-radius:99px;background:var(--chip);position:relative;flex:none;border:1px solid var(--line)}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.tg.on{background:var(--acc)}.tg.on:after{left:22px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(8,20,50,.28);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{display:grid;place-items:center;height:24px}nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--acc);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--onacc);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .2s;max-width:720px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=number],input[type=time]{font-family:inherit;width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:14px;cursor:pointer}
.cat.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn{width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--onacc);font-size:17px;font-weight:650;padding:14px;margin-top:16px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink);margin-top:8px}.btn.red{background:var(--bad)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:#14212e;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ldds{border-left:5px solid var(--blue);cursor:pointer}
.ldds .t{font-size:13px;color:var(--mut)}.ldds .big{font-size:28px;font-weight:700;color:var(--blue);margin:2px 0}
.ldds .s{font-size:13px;color:var(--mut);line-height:1.4}
.linkbtn{background:none;border:0;color:var(--blue);font-size:14px;padding:8px 0;cursor:pointer;text-align:left}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--chip);border-top-color:var(--acc);margin:18px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tl{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:6px}
.tl .row{padding:7px 0;font-size:14px}
.who{display:flex;gap:8px;margin-bottom:12px}.who .cat{flex:1;text-align:center;padding:10px 6px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 12px;text-align:center;cursor:pointer;border:0;color:var(--ink);font-size:14px;font-weight:600}
.tile span{display:block;font-size:30px;margin-bottom:6px}.tile small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:3px}
.tile.soon{opacity:.6}
.amz{display:flex;gap:6px;align-items:center}.amz .col{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);width:44px}
.row.done{opacity:.55}.am small{display:block;font-size:10px;font-weight:500;color:var(--mut)}.pill.bad{background:var(--bad);color:var(--onacc)}.pill.ok{background:var(--acc);color:var(--onacc)}.pill.warn{background:var(--warn);color:#fff}
.soc{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.soc:last-child{border-bottom:0}
.soc .rt b{white-space:normal}
.empty{text-align:center;color:var(--mut);padding:30px 10px;line-height:1.5}
/* ---------- 🍽 Repas (v1.6.0) ---------- */
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:10}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;padding:9px 2px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.wk{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.wk button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.wk button.on{background:var(--hero1);border-color:var(--hero1);color:#fff}
.ph{background:var(--chip) center/cover no-repeat;display:grid;place-items:center;font-size:30px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tonight{border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.tonight .ph{height:150px;font-size:54px}
.tonight .in{padding:14px 16px}
.tonight small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tonight b{display:block;font-size:19px;margin:3px 0 4px;line-height:1.25}
.tonight .tm{font-size:13px;color:var(--mut)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duo .btn{margin:0}
.dayc{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;margin-bottom:8px}
.dayc .ph{width:64px;height:64px;border-radius:12px;flex:none;font-size:26px}
.dayc .rt b{white-space:normal;line-height:1.25;font-size:15px}
.dayc.today{outline:2px solid var(--acc)}
.dayc .dl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer}
.acts button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;color:var(--ink)}
.rcard .ph{height:104px}
.rcard div.t{padding:8px 10px 10px;font-size:13px;font-weight:600;line-height:1.25}
.rcard div.t span{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:3px}
.fh{margin:-18px -16px 12px;height:200px;border-radius:24px 24px 0 0}
.tline{display:flex;align-items:stretch;gap:6px;margin:10px 0 14px;text-align:center;font-size:12px}
.tline div{flex:1;background:var(--chip);border-radius:12px;padding:8px 4px}
.tline b{display:block;font-size:16px}
.tline .hc{background:#0e9f6e22;color:var(--acc)}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ings li span{color:var(--mut);text-align:right}
.steps{padding-left:0;list-style:none;counter-reset:st;margin:6px 0}
.steps li{counter-increment:st;position:relative;padding:8px 0 8px 36px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4;cursor:pointer}
.steps li:before{content:counter(st);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps li.done{color:var(--mut);text-decoration:line-through}
.steps li.done:before{content:"✓";background:var(--acc);color:var(--onacc)}
.sth{font-size:13px;font-weight:700;margin:14px 0 2px;display:flex;justify-content:space-between}
.sth span{font-weight:500;color:var(--mut)}
.credit{font-size:10px;color:var(--mut);margin-top:12px;line-height:1.4}
.credit a{color:var(--mut)}
.ctot{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.ctot .l{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
.ctot .big{font-size:26px;font-weight:700}
.live{font-size:11px;color:var(--acc);font-weight:600}
.rayon{font-size:12px;color:var(--mut);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
.citem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.citem:last-child{border-bottom:0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:16px;color:#fff;background:var(--card)}
.citem.achete .ck{background:var(--acc);border-color:var(--acc)}
.citem.maison .ck{background:var(--blue);border-color:var(--blue)}
.citem.achete .rt b,.citem.maison .rt b{text-decoration:line-through;color:var(--mut)}
.citem.achete,.citem.maison{opacity:.6}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 8px;font-size:15px;cursor:pointer;flex:none;color:var(--ink)}
.deck{position:relative;height:430px;margin-top:6px;touch-action:pan-y}
.swc{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden;user-select:none;transition:transform .25s}
.swc .ph{height:260px;font-size:64px;pointer-events:none}
.swc .in{padding:14px 16px}
.swc b{font-size:19px;display:block;line-height:1.25}
.swc .tag{display:inline-block;margin-top:8px;font-size:12px;border-radius:99px;padding:4px 10px;background:var(--chip)}
.swc .tag.ok{background:#0e9f6e22;color:var(--acc)}
.swc .tag.warn{background:#d98a0022;color:var(--warn)}
.swc .stamp{position:absolute;top:20px;font-size:26px;font-weight:800;padding:4px 12px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg)}
.swc .stamp.yes{left:18px;color:var(--acc)}.swc .stamp.no{right:18px;color:var(--bad);transform:rotate(12deg)}
.swbtn{display:flex;justify-content:center;gap:26px;margin-top:14px}
.swbtn button{width:64px;height:64px;border-radius:50%;border:0;font-size:28px;box-shadow:var(--shadow);background:var(--card);cursor:pointer}
.pick{max-height:52vh;overflow:auto}
.pick .row{cursor:pointer}
.pick .ph{width:48px;height:48px;border-radius:10px;flex:none;font-size:20px}
select{font-family:inherit;width:100%;font-size:16px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips .cat{padding:7px 11px;font-size:13px}
/* ---------- v1.7.0 : profils, congés ---------- */
#prof{font-weight:800;font-size:15px;margin-right:6px}
.kpis{display:grid;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11px;color:var(--mut);line-height:1.35;display:block;margin-top:2px}
details summary::-webkit-details-marker{color:var(--mut)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* v1.8 : statistiques, note des courses, bourse, état de l'appli */
.tline small.dans{display:block;font-size:11px;font-weight:600;color:var(--acc);margin-top:1px}
.nsl{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font-weight:800;font-size:17px;vertical-align:middle}
.nsl.pt{width:20px;height:20px;border-radius:6px;font-size:12px}
.nscard{text-align:center}
.nsbar{display:flex;justify-content:center;gap:3px;margin:6px 0 4px}
.nsbar span{width:40px;height:40px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;opacity:.35;border-radius:8px}
.nsbar span.on{opacity:1;width:56px;height:56px;font-size:28px;margin-top:-8px;box-shadow:0 3px 10px rgba(0,0,0,.25);border-radius:12px}
.nsscore{font-size:13px;color:var(--mut);margin-bottom:6px}.nsscore b{font-size:22px;color:var(--ink)}
.nscrit{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.nscrit>div:first-child{flex:1}.nscrit b{display:block;font-size:14px}.nscrit span{font-size:12px;color:var(--mut)}
.pts{font-weight:700;font-size:14px;border-radius:9px;padding:4px 8px;background:var(--chip)}
.pts.ok{color:#0b7f3f}.pts.moy{color:#b07800}.pts.bad{color:#d9382c}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpis div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpis b{display:block;font-size:19px}.kpis span{font-size:12px;color:var(--mut)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 10px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}.lg i{width:12px;height:12px;border-radius:4px}.lg b{margin-left:auto;font-weight:600}
.hbar{padding:5px 0}.hl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.hl span{color:var(--mut)}
.ht{height:9px;background:var(--chip);border-radius:6px;overflow:hidden}.ht i{display:block;height:100%;border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:3px;padding-top:4px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.col em{font-style:normal;color:var(--mut);font-size:9px;white-space:nowrap;letter-spacing:-.3px}
.col small{color:var(--mut);white-space:nowrap;font-size:9.5px;text-align:center;line-height:1.15}.col small.mb{color:#e8590c;font-weight:600}
.cb{width:100%;max-width:26px;display:flex;flex-direction:column;border-radius:5px 5px 2px 2px;overflow:hidden}.cb i{display:block}
.cols.dow .col{min-width:0}.cols.dow .cb{max-width:30px}
.card.mag,.card.pos{padding:12px 14px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.mh span{color:var(--mut);font-size:13px}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--mut)}.mk b{display:block;font-size:15px;color:var(--ink)}
.rk{width:24px;height:24px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.am small{font-weight:400;color:var(--mut);font-size:11px}
.cmp{padding:8px 0;border-bottom:1px solid var(--line)}.cmp:last-child{border:0}.cmp small{color:var(--mut);font-size:11px;margin-left:6px}
.cmpl{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}

<script>
"use strict";
const APP_VERSION = "1.31.0";      // posé par build.py d'après src/version.json
const SCRIPT_ATTENDU = 52;       // version du script que cette appli attend
const CATS = { "Courses": "🛒", "Animaux": "🐾", "Bébé": "🍼", "Loisirs": "🎉", "Véhicule": "⛽", "Hors budget": "📦" };
const ENVS = [["courses", "Courses", "🛒"], ["animaux", "Animaux", "🐾"], ["bebe", "Bébé", "🍼"], ["loisirs", "Loisirs", "🎉"], ["vehicule", "Véhicules", "⛽"]];
const CAT_ENV = { "Courses": "courses", "Animaux": "animaux", "Bébé": "bebe", "Loisirs": "loisirs", "Véhicule": "vehicule" };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const S = {
  tab: "home",
  cfg: LS.get("bf.cfg", { url: "", key: "" }),
  base: LS.get("bf.base", null),
  queue: LS.get("bf.queue", []),
  who: LS.get("bf.who", "Commun"), soFilter: "att", flushing: false, loading: false, offline: false, error: "", edit: null, form: null
};

// ---------- utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const eur = n => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(Number(n) || 0);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
function fmtDay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const t = todayISO();
  if (iso === t) return "Aujourd'hui";
  const dt = new Date(y, m - 1, d);
  const y1 = new Date(); y1.setDate(y1.getDate() - 1);
  if (iso === y1.getFullYear() + "-" + pad(y1.getMonth() + 1) + "-" + pad(y1.getDate())) return "Hier";
  return dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}
function fmtMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function toast(msg) {
  try { if (/^(⚠|Refusé|🔐)/.test(String(msg))) noterErreur(msg); } catch (e) {}   // gardé pour la boîte à idées (dernière erreur)
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3200);
}
const saveCfg = () => LS.set("bf.cfg", S.cfg);
const saveBase = () => LS.set("bf.base", S.base);
const saveQueue = () => LS.set("bf.queue", S.queue);

// ---------- catégorie automatique (même règle que le Sheet) ----------
function categorize(lib) {
  const kws = (S.base && S.base.motsCles) || [];
  const mots = norm(lib).split(/[^a-z0-9]+/).filter(Boolean);
  let best = null;
  kws.forEach(([k, c]) => {
    const ws = norm(k).split(/[^a-z0-9]+/).filter(Boolean);
    if (!ws.length) return;
    const ok = ws.every(w => mots.some(m => m.indexOf(w) === 0 || (w.length >= 5 && m.indexOf(w) !== -1)));
    if (!ok) return;
    const score = ws.length * 1000 + ws.join("").length;
    if (!best || score > best.score) best = { score, cat: c };
  });
  return best ? best.cat : null;
}
function parseQuick(text) {
  const m = String(text).trim().match(/^(.*?)[\s:=-]+(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur|euros|e)?$/i);
  if (!m) return null;
  return { lib: m[1].trim(), mont: parseFloat(m[2].replace(",", ".")) };
}

// ---------- état affiché = état du Sheet + opérations en attente ----------
function computeView() {
  if (!S.base) return null;
  const v = JSON.parse(JSON.stringify(S.base));
  S.queue.forEach(op => applyOp(v, op));
  try { fbAppliquer(v); } catch (e) {}   // v1.28 : courses en direct (Firestore) par-dessus
  return v;
}
function shift(v, cat, mont, ldds, sign) {
  if (ldds) return;
  const k = CAT_ENV[cat];
  if (k && v.enveloppes[k]) { v.enveloppes[k].restant -= sign * mont; v.enveloppes[k].depense += sign * mont; }
  else { v.totaux.horsBudget += sign * mont; v.totaux.budgetRestant -= sign * mont; }
  v.totaux.soldeTheorique -= sign * mont;
}
function applyOp(v, op) {
  const p = op.payload;
  if (V19_TYPES.includes(op.type)) { v19Apply(v, op); return; }
  if (String(op.type).indexOf("repas") === 0) { repasApply(v, op); return; }
  if (op.type === "add" && isPerso(p.qui)) { persoAdd(v, p.qui, p.cat, p.lib, p.mont, p.date, op.id); }
  else if (op.type === "del" && isPerso(p.qui)) { persoDel(v, p.qui, p.lib, p.mont); }
  else if (op.type === "add") {
    v.journal.unshift({ date: p.date, lib: p.lib, mont: p.mont, cat: p.cat, ldds: p.ldds === true, pending: op.id });
    shift(v, p.cat, p.mont, p.ldds === true, 1);
    if (p.ldds === true) lddsMove(v, -p.mont);
  } else if (op.type === "del") {
    const i = v.journal.findIndex(j => j.date === p.date && j.lib === p.lib && Math.abs(j.mont - p.mont) < .005 && j.ldds === (p.ldds === true));
    if (i >= 0) { v.journal.splice(i, 1); shift(v, p.cat, p.mont, p.ldds === true, -1); if (p.ldds === true) lddsMove(v, p.mont); }
  } else if (op.type === "plein") {
    const c = fuelCalc(p);
    if (c.l > 0 && c.p > 0) {
      if (!v.vehicule) v.vehicule = { pleins: [], kmActuel: 0, payeurs: ["Commun", "Mathilde", "Gaétan"], types: ["Plein", "Complément"] };
      v.vehicule.pleins.unshift({ date: todayISO(), litres: c.l, prix: c.p, km: p.km, qui: p.qui, prixL: c.q, conso: null, dist: null, type: p.type, pending: op.id });
      v.vehicule.kmActuel = Math.max(v.vehicule.kmActuel || 0, p.km);
      if (p.qui === "Commun") {
        v.journal.unshift({ date: todayISO(), lib: "Plein SEAT", mont: c.p, cat: "Véhicule", ldds: false, pending: op.id });
        shift(v, "Véhicule", c.p, false, 1);
      }
    }
  } else if (op.type === "ticket") {
    const m = Number(p.total) || 0;
    if (m > 0 && isPerso(p.qui)) { persoAdd(v, p.qui, p.cat, p.magasin || "Ticket", m, p.date, op.id); }
    else if (m > 0) {
      v.journal.unshift({ date: p.date, lib: p.magasin || "Ticket", mont: m, cat: p.cat, ldds: false, pending: op.id });
      shift(v, p.cat, m, false, 1);
    }
  } else if (op.type === "soin") { soinApply(v, p, op.id);
  } else if (op.type === "soinmaj") { const s = v.soins && v.soins.liste.find(x => x.id === p.soinId); if (s) { s.etape = p.etape; s.note = p.note; soinCalc(s); }
  } else if (op.type === "soindel") { if (v.soins) v.soins.liste = v.soins.liste.filter(x => x.id !== p.soinId);
  } else if (op.type === "entree") { entreeApply(v, p);
  } else if (op.type === "amazon") { amzApply(v, p);
  } else if (op.type === "ldds") {
    if (v.ldds) {
      const old = v.ldds.soldeEstime != null ? v.ldds.soldeEstime : v.ldds.soldeReel;
      v.ldds.soldeFinMois += p.mont - old; v.ldds.soldeEstime = p.mont; v.ldds.soldeReel = p.mont; v.ldds.releveLe = todayISO();
    }
  } else if (op.type === "solde") {
    v.totaux.soldeTheorique = p.mont; v.previsionnel.soldeReel = p.mont;
  } else if (op.type === "annuelmod" || op.type === "annuelsup" || op.type === "annuelajout") { applyAnn114(v, op);
  } else if (op.type === "annuel") {
    const a = v.annuels.find(x => x.row === p.row && x.lib === p.lib) || v.annuels.find(x => x.lib === p.lib && Math.abs(x.mont - p.mont) < .005 && x.paye !== p.paye);
    if (a && a.paye !== p.paye) {
      a.paye = p.paye; a.datePaye = p.paye ? todayISO() : "";
      v.totaux.soldeTheorique += (p.paye ? -1 : 1) * a.mont;
      v.totaux.ldds += (p.paye ? 1 : -1) * a.mont;
      if (v.ldds && v.ldds.soldeEstime != null) v.ldds.soldeEstime -= (p.paye ? 1 : -1) * a.mont;
    }
  }
}

// ---------- carburant ----------
function num(x) {
  if (x === null || x === undefined || String(x).trim() === "") return null;
  const n = parseFloat(String(x).replace(/\s/g, "").replace(",", ".").replace(/[^\d.\-]/g, ""));
  return isNaN(n) ? null : n;
}
// 2 valeurs sur 3 suffisent : la troisième est calculée
function fuelCalc(f) {
  let l = num(f.litres), p = num(f.prix), q = num(f.prixL), calc = "";
  if (l !== null && p !== null) { if (q === null && l > 0) { q = p / l; calc = "q"; } }

async function call(action, payload, ms) {

  const to = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const res = await fetch(S.cfg.url, {
      method: "POST", redirect: "follow", signal: ctrl.signal,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ key: S.cfg.key, action }, payload || {}))

    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new Error("réponse inattendue du Sheet"); }

  } finally { clearTimeout(to); }
}

      else { S.error = r.error; if (!silent) toast("⚠ " + r.error); }

async function flush() {
  if (S.flushing || !configured()) return;
  S.flushing = true; setSync();
  try {
    let lourd = false;
    while (S.queue.length) {
      const op = S.queue[0];
      const r = await call(op.type, Object.assign({}, op.payload, { id: op.id }), op.type === "repasinstall" ? 180000 : (op.type === "idee" && op.payload.capture) ? 120000 : op.type === "voyage" || op.type === "boursecorr" || op.type === "boursmeta" || op.type === "regleajout" || op.type === "reglesup" || op.type === "fixemod" ? 60000 : 30000);
      if (r.ok) {
        S.queue.shift(); saveQueue();
        if (r.courses) { fusionCourses(r.courses); }
        else if (r.conges) { S.cg = { data: r.conges, at: Date.now() }; LS.set("bf.cg", S.cg); }
        else if (r.gtasks) { S.gt = { data: r.gtasks, at: Date.now() }; }
        else if (r.bourse) { S.bo = { data: r.bourse, at: Date.now() }; LS.set("bf.bo", S.bo); }
        else if (r.v19) { S.base.v19 = Object.assign({}, S.base.v19, r.v19); saveBase(); }
        else if (r.v110) { S.base.v110 = Object.assign({}, S.base.v110, r.v110); saveBase(); }

        else { lourd = true; if (S.queue.length === 0 && r.state) { S.base = r.state; saveBase(); } }
        S.offline = false; S.error = "";
        S.essais = 0;
      } else if (r.retry) {
        // le Sheet est occupé ou Google a eu un raté : la saisie RESTE dans la file, on réessaie plus tard (5 s, 10 s, 20 s… 60 s au plus)
        S.essais = (S.essais || 0) + 1;
        if (S.essais === 1 || S.essais === 6) toast(S.essais === 1 ? "⏳ Le Sheet est occupé : je réessaie tout seul" : "⏳ Le Sheet ne répond toujours pas : ta saisie est gardée, je continue d'essayer");
        S.pause = true; clearTimeout(flush.t);
        flush.t = setTimeout(() => { S.pause = false; flush(); }, Math.min(60000, 5000 * Math.pow(2, S.essais - 1)));
        break;
      } else if (r.error === "clé invalide" || /code de l'appli/.test(r.error)) {
        S.error = r.error; toast("🔐 Code incorrect : vérifie les Réglages"); break;
      } else {
        S.queue.shift(); saveQueue(); toast("Refusé par le Sheet : " + r.error);

  } catch (e) { S.offline = true; }
  S.flushing = false; setSync(); if (!renduDiffere()) render();
  if (S.queue.length && !S.error && !S.offline && !S.pause) setTimeout(flush, 0);
}

function courbeSolde(v) {
  const p = (v.jours || []).map(j => num(String(j.solde || "").replace(/\s/g, ""))).filter(x => typeof x === "number" && isFinite(x));

  const pts = p.map((y, i) => [Math.round(i / (p.length - 1) * W), Math.round(H - 4 - (y - mn) * k)]);
  const d = pts.map((q, i) => (i ? "L" : "M") + q[0] + " " + q[1]).join(" ");
  return `<svg class="courbe" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H}Z" class="cz"/><path d="${d}" class="cl"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3.5" class="cp"/></svg>`;
}

}

// ---------- lecture d'un ticket ----------
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => rej(new Error("image illisible"));
    im.src = u;
  });
}
function fileB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("lecture du fichier impossible")); r.readAsDataURL(file); });
}
async function filePayload(file) {
  if (file.type === "application/pdf") {
    if (file.size > 7 * 1024 * 1024) throw new Error("PDF trop lourd (7 Mo maximum)");
    return { mime: "application/pdf", data: await fileB64(file) };
  }
  const im = await loadImage(file);
  const k = Math.min(1, 2400 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return { mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
}
async function scanTicket(file) {
  if (!file) return;
  if (!navigator.onLine || S.offline) { toast("Il faut du réseau pour lire un ticket"); return; }
  openSheet(`<h3>📷 Lecture du ticket…</h3><div class="spin"></div><div class="hint" style="text-align:center">Gemini analyse le ticket : quelques secondes, jusqu'à 2 minutes pour un long ticket en PDF. Garde l'appli ouverte.</div>`);
  try {
    const pl = await filePayload(file);
    const r = await call("scan", pl, 180000);   // v1.26 : 70 s ne suffisaient pas pour un ticket Leclerc de 3 pages
    if (!r.ok) throw new Error(r.error || "lecture impossible");
    if (S.finCourses) finCoursesComparer(r.ticket); else openTicket(r.ticket);
  } catch (e) {
    closeSheet();
    toast("⚠ " + (e.name === "AbortError" ? "Gemini n'a pas répondu en 3 minutes, réessaie" : String(e.message || e).replace(/^Gemini 503.*$/, "Gemini est surchargé chez Google, réessaie dans quelques minutes")));
  }
}
function guessTicketCat(t) {
  let c = categorize(t.magasin || "");
  if (c) return { cat: c, auto: true };
  const n = {};
  (t.lignes || []).forEach(l => { const x = categorize(l.lib); if (x) n[x] = (n[x] || 0) + 1; });
  const best = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  return best ? { cat: best, auto: true } : { cat: "Hors budget", auto: false };
}

// =====================================================================
// RÈGLES PARTAGÉES entre l'appli et le script (ce fichier est inclus tel quel dans les deux par build.py).
// Une règle métier commune s'écrit ICI, une seule fois. Syntaxe simple (var / function) valable des deux côtés.
// Dates : texte « AAAA-MM-JJ ».
// =====================================================================
var REGLE_ASSURANCES = ["habitation", "auto", "sante"];   // types de contrat résiliables à tout moment après 1 an
// nombre de jours de la date a à la date b
function regleJours(a, b) {
  return Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 86400000);
}
// date + n mois (le 31 devient le dernier jour du mois d'arrivée)
function reglePlusMois(iso, n) {
  var y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + n, d = +iso.slice(8, 10);
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  var max = new Date(y, m + 1, 0).getDate(), p = function (x) { return ("0" + x).slice(-2); };
  return y + "-" + p(m + 1) + "-" + p(Math.min(d, max));
}
// Quand peut-on renégocier un contrat ? Règle INDICATIVE :
//   - la date « renégociable à partir du » saisie à la main l'emporte ;
//   - assurances (habitation, auto, santé) : 1 an après la souscription, puis à tout moment ;
//   - le reste : à la fin de l'engagement s'il y en a un, sinon tout de suite.
function regleContratDepuis(c) {
  if (c.depuis) { return { date: c.depuis, connu: true, manuel: true }; }
  if (REGLE_ASSURANCES.indexOf(c.type) >= 0) { return c.souscrit ? { date: reglePlusMois(c.souscrit, 12), connu: true } : { date: "", connu: false }; }
  return c.echeance ? { date: c.echeance, connu: true } : { date: "", connu: true, immediat: true };
}
// état d'un contrat au jour « auj » : inconnu | libre (à revoir maintenant) | verifie (contrôlé il y a moins de 180 jours) | bientot (≤ 60 jours) | attente
function regleContratEtat(c, auj) {
  var d = regleContratDepuis(c);
  if (!d.connu) { return "inconnu"; }
  if (d.immediat || d.date <= auj) { return (c.controle && regleJours(c.controle, auj) < 180) ? "verifie" : "libre"; }
  return regleJours(auj, d.date) <= 60 ? "bientot" : "attente";
}

// ---------- Calendrier de paie ----------
// Gaétan : calendrier prévisionnel des mises en paiement, colonne Île-de-France (syndicat Unité, 19/01/2026, « sous réserve de modifications des SGAMI »).
// Une année absente reprend la dernière année connue : ajouter ici la ligne 2027 quand le calendrier sera publié.
var PAIE_IDF = { 2026: [27, 24, 26, 27, 26, 25, 28, 26, 25, 27, 25, 22] };
// jour de paie d'un mois (mois0 : 0 = janvier), pour "G" (Gaétan) ou "M" (Mathilde).
// perso = dates saisies dans l'appli : { G: { "2027": [12 jours] }, M: { … } } ; elles l'emportent sur le calendrier ci-dessus.
// Une année sans dates reprend la dernière année connue. Mathilde sans dates : avant-dernier jour du mois (« dans les 3 derniers jours »), estimé.
function reglePaieTable(qui, annee, perso) {
  var T = {}, k;
  if (qui === "G") { for (k in PAIE_IDF) { T[k] = PAIE_IDF[k]; } }
  if (perso && perso[qui]) { for (k in perso[qui]) { if (perso[qui][k] && perso[qui][k].length === 12) { T[k] = perso[qui][k]; } } }
  var ref = null;
  Object.keys(T).map(Number).sort(function (a, b) { return a - b; }).forEach(function (a) { if (ref === null || a <= annee) { ref = a; } });
  return ref === null ? null : { an: ref, jours: T[ref], exact: ref === annee };
}
function reglePaieDate(qui, annee, mois0, perso) {
  var p = function (x) { return ("0" + x).slice(-2); }, fin = new Date(annee, mois0 + 1, 0).getDate(), t = reglePaieTable(qui, annee, perso);
  var jour = t ? Math.min(Number(t.jours[mois0]) || fin - 1, fin) : fin - 1;
  return annee + "-" + p(mois0 + 1) + "-" + p(jour);
}
// prochaine paie à partir du jour « auj » (le jour même compte) : { date, estime }
function reglePaieProchaine(qui, auj, perso) {
  var y = +auj.slice(0, 4), m = +auj.slice(5, 7) - 1, d = reglePaieDate(qui, y, m, perso);
  if (d < auj) { m++; if (m > 11) { m = 0; y++; } d = reglePaieDate(qui, y, m, perso); }
  return { date: d, estime: !reglePaieTable(qui, y, perso) };
}
// jour du mois à partir duquel l'appli demande « As-tu reçu ton salaire ? » : la veille de la date de paie prévue
function reglePaieJourQuestion(qui, ym, perso) {
  return Math.max(1, +reglePaieDate(qui, +ym.slice(0, 4), +ym.slice(5, 7) - 1, perso).slice(8, 10) - 1);
}

// ---------- Projection d'un placement (objectifs PEA / CTO) ----------
// Hypothèses : rendement annuel constant, versement identique chaque mois, valeur BRUTE (ni inflation ni impôts). Indicatif, jamais une promesse.
function regleTauxMensuel(tauxAn) { return Math.pow(1 + tauxAn / 100, 1 / 12) - 1; }
// valeur dans nMois, en partant de « valeur » et en versant « mensuel » chaque mois
function regleProjection(valeur, mensuel, tauxAn, nMois) {
  var r = regleTauxMensuel(tauxAn), f = Math.pow(1 + r, nMois);
  return valeur * f + (r === 0 ? mensuel * nMois : mensuel * (f - 1) / r);
}
// nombre de mois pour atteindre « cible » (null si pas atteint en 60 ans)
function regleMoisPourCible(valeur, mensuel, tauxAn, cible) {
  if (valeur >= cible) { return 0; }
  for (var n = 1; n <= 720; n++) { if (regleProjection(valeur, mensuel, tauxAn, n) >= cible) { return n; } }
  return null;
}
// versement mensuel nécessaire pour atteindre « cible » dans nMois
function regleMensuelPourCible(valeur, tauxAn, nMois, cible) {
  var r = regleTauxMensuel(tauxAn), f = Math.pow(1 + r, nMois), reste = cible - valeur * f;
  if (reste <= 0) { return 0; }
  return r === 0 ? reste / nMois : reste * r / (f - 1);
}
// nombre de mois entre deux mois « AAAA-MM »
function regleMoisEntre(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }

    q.forEach(x => { m[Number(x.id)] = x.data(); });

    if (!ok) { if ((essai || 0) < 3) setTimeout(() => fbEtatRecu(h, (essai || 0) + 1), 1500); return; }   // morceaux encore en route

function fbEstManuel(sem, produit) {

// ---------- fusion : l'état en direct passe par-dessus les données du Sheet (appelée par computeView) ----------
function fbAppliquer(v) {
  if (!directActif() || !v || !v.repas || !v.repas.installe) return;
  const S2 = v.repas.semaines = v.repas.semaines || {};
  Object.keys(FB.docs).forEach(sem => {
    const w = S2[sem] = S2[sem] || { jours: [], etats: {}, manuels: [] };
    w.etats = w.etats || {}; w.manuels = w.manuels || []; w.qte = w.qte || {}; w.payes = w.payes || {};
    Object.values(FB.docs[sem]).forEach(a => {
      if (!a || !a.produit) return;
      if (a.manuel) {
        let m = w.manuels.find(x => x.lib === a.produit);
        if (a.supprime) { w.manuels = w.manuels.filter(x => x.lib !== a.produit); return; }
        if (!m) { m = { lib: a.produit, rayon: a.rayon || "Divers", prix: Number(a.prix) || 0, qte: Number(a.qte) || 1, etat: "", prec: a.prec || "" }; w.manuels.push(m); }
        if (a.etat !== undefined) m.etat = a.etat;
        if (a.qte !== undefined) m.qte = Number(a.qte) || 1;
        if (a.prix !== undefined) m.prix = Number(a.prix) || 0;
        if (a.prec !== undefined) m.prec = a.prec;
        if (a.rayon) m.rayon = a.rayon;
      } else {
        if (a.etat !== undefined) { if (a.etat) w.etats[a.produit] = a.etat; else delete w.etats[a.produit]; }
        if (a.qte !== undefined) { if (Number(a.qte) > 0) w.qte[a.produit] = Number(a.qte); else delete w.qte[a.produit]; }

}

  const courant = c.j && c.j.id;
  c.jours.filter(j => estPlat(j) && j.date > today && j.id !== courant).forEach(j => {
    const r = recette(v, j.id); if (r && !vus.has(r.id)) { vus.add(r.id); out.push({ r, swap: j.date, tag: "Inverser avec " + jourLong(j.date).toLowerCase() + " : rien à racheter", cls: "ok" }); }
  });
  const achete = new Set(Object.keys(semData(v, c.sem).etats || {}));
  besoins(v, c.jours) && Object.keys(besoins(v, c.jours)).forEach(n => achete.add(n));
  const reste = proposables(v).filter(r => !vus.has(r.id) && r.id !== courant).map(r => tiroirScore(v, r, achete));
  reste.filter(x => !x.manque.length).sort(() => Math.random() - .5).forEach(x => { vus.add(x.r.id); out.push({ r: x.r, tag: "Faisable avec tes courses", cls: "ok" }); });
  reste.filter(x => x.manque.length).sort((a, b) => a.manque.length - b.manque.length).slice(0, 12).forEach(x => out.push({ r: x.r, tag: "Il manque : " + x.manque.join(", "), cls: "warn" }));
  return out;
}

function choisirCeSoir(id, swapDate) {
  const v = computeView(), c = ceSoir(v), r = recette(v, id); if (!r) return;
  let jours = c.jours.map(j => Object.assign({}, j));
  const today = todayISO();
  let i = jours.findIndex(j => j.date === today);
  if (i < 0) { jours.push({ date: today, id, nom: r.nom, portions: 4, type: "cuisine" }); }
  else if (swapDate) {
    const k = jours.findIndex(j => j.date === swapDate);
    const a = { id: jours[i].id, nom: jours[i].nom }; jours[i].id = jours[k].id; jours[i].nom = jours[k].nom; jours[i].type = "cuisine"; jours[k].id = a.id; jours[k].nom = a.nom;
  } else { jours[i] = Object.assign(jours[i], { id, nom: r.nom, type: "cuisine", portions: jours[i].portions || 4 }); }
  enregistrerSemaine(v, c.sem, jours);
  closeSheet(); toast("✔ Ce soir : " + r.nom);
}
// glisser la carte au doigt
(function swipe() {
  let x0 = null, el = null, dx = 0;
  document.addEventListener("pointerdown", e => { const c = e.target.closest("#swc"); if (!c) return; el = c; x0 = e.clientX; dx = 0; el.style.transition = "none"; });
  document.addEventListener("pointermove", e => {
    if (!el) return; dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    el.querySelector(".stamp.yes").style.opacity = Math.max(0, Math.min(1, dx / 90));
    el.querySelector(".stamp.no").style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const fin = () => {
    if (!el) return; const c = el; el = null; c.style.transition = "";
    if (dx > 90) { c.style.transform = "translateX(140%) rotate(20deg)"; setTimeout(() => deckOui(), 180); }
    else if (dx < -90) { c.style.transform = "translateX(-140%) rotate(-20deg)"; setTimeout(() => deckNon(), 180); }
    else c.style.transform = "";
  };
  document.addEventListener("pointerup", fin); document.addEventListener("pointercancel", fin);
})();
function deckNon() { S.deck.i++; renderDeck(); }
function deckOui() { const x = S.deck.list[S.deck.i]; if (x) choisirCeSoir(x.r.id, x.swap); }

function rayonsAjout(v) {
  const s = new Set((R(v).produits || []).filter(p => !estPlacard(p)).map(p => p.r).filter(Boolean));

const RAYON_MOTS = [
  ["Surgelés", /glace|ben ?(&|et|and)? ?jerr|sorbet|magnum|esquimau|batonnet|surgel|frites|poelee|nuggets|cordon bleu/],
  ["Hygiène & maison", /papier|lessive|savon|shampo|dentifrice|brosse|eponge|poubelle|litiere|film|aluminium|essuie|couche|lingette|vaisselle|javel|mouchoir|coton|deodorant|gel douche|adoucissant|nettoyant|pile|ampoule|croquette|patee/],
  ["Boulangerie", /\bpain|baguette|brioche|croissant|viennois|pain au chocolat/],
  ["Charcuterie", /jambon|saucisson|chorizo|lardon|rillette|\bpate\b.*(campagne|foie)|salami|bacon/],
  ["Boucherie & volaille", /poulet|boeuf|porc|steak|viande|dinde|saucisse|merguez|veau|agneau|escalope|cuisse/],
  ["Crèmerie & œufs", /\blait\b|yaourt|fromage|beurre|creme|oeuf|skyr|kiri|babybel|emmental|mozzarella|comte|gruyere|parmesan|dessert lacte|flan|danette/],
  ["Petit-déjeuner & boissons", /cafe|\bthe\b|cereale|\bjus\b|\beau\b|soda|biere|\bvin\b|sirop|confiture|nutella|biscotte|chocolat en poudre|cacao|coca|limonade/],
  ["Fruits & légumes", /fruit|legume|salade|tomate|pomme|poire|banane|orange|citron|carotte|oignon|\bail\b|courgette|poireau|persil|cive|piment|poivron|champignon|avocat|raisin|fraise|kiwi|melon|clementine|herbe|coriandre|basilic|concombre|patate|pomme de terre|epinard|chou/],
  ["Épicerie", /pates|spaghetti|\briz\b|farine|sucre|huile|conserve|biscuit|chips|cacahuete|gateau|bonbon|chocolat|sauce|epice|\bsel\b|poivre|ketchup|mayonnaise|moutarde|vinaigre|semoule|lentille|compote|apero/]
];
function rayonDevine(v, nom) {
  const n = sansAccent(nom).trim(); if (!n) return "Divers";
  // 1) déjà ajouté à la main une autre semaine : même rayon que la dernière fois
  let appris = null;
  Object.values(R(v).semaines || {}).forEach(w => (w.manuels || []).forEach(m => { if (sansAccent(m.lib) === n && m.rayon && m.rayon !== "Divers") appris = m.rayon; }));
  try { const L = JSON.parse(localStorage.getItem("bf.rayonsAppris") || "{}"); if (L[n]) appris = L[n]; } catch (e) {}
  if (appris) return appris;
  // 2) un produit connu dont le nom est contenu dans ce qui est tapé (« lait demi-écrémé » → rayon du lait)
  const p = (R(v).produits || []).filter(x => !estPlacard(x) && x.r).sort((a, b) => b.n.length - a.n.length).find(x => n.includes(sansAccent(x.n)));
  if (p) return p.r;
  // 3) mots-clés
  const k = RAYON_MOTS.find(([, re]) => re.test(n));
  return k ? k[0] : "Divers";
}

function frac(x) {
  const e = Math.floor(x), r = Math.round((x - e) * 4) / 4, f = { 0: "", .25: "¼", .5: "½", .75: "¾", 1: "" }[r];
  const ent = r === 1 ? e + 1 : e;
  return (ent ? ent : "") + (f || "") || "¼";
}
function qteSauce(q, u) {
  if (u === "ml" || u === "g") { const x = Math.max(5, Math.round(q / 5) * 5); return x + " " + u; }
  return frac(q) + " " + u + (q > 1.25 && /gousse|citron|cube/.test(u) ? "s" : "");
}

function conseilCompteur(d, du, au) {
  const an = du.slice(0, 4), mois = Number(du.slice(5, 7)), horsPeriode = mois <= 4 || mois >= 11;
  // v1.22 : RPS et HS (en heures) proposés aussi pour des journées entières (8 h par jour), après les compteurs en jours

  const score = c => {

    if (horsPeriode && c.n === "CA " + an && hp && /encore/i.test(hp.palier)) return { s: 0, r: "hors période : compte pour tes HP (" + hp.palier.toLowerCase() + ")" };

    if (c.n === "CET") return { s: 9, r: "à garder pour un long voyage" };
    if (c.unite === "heures") return { s: 8, r: "compteur en heures : " + ((d.hpj || 8) + " h").replace(".", ",") + " par jour posé" };
    return { s: 2 + (c.limite ? Number(c.limite.replace(/-/g, "")) / 1e8 : 5), r: c.limite ? "à poser avant le " + courtD(c.limite) + "/" + c.limite.slice(0, 4) : "" };

  return ok.map(c => Object.assign({ c }, score(c))).sort((a, b) => a.s - b.s);

// ---------- conseil : quel jour faire les courses ----------
// v1.26 : TOUTES les possibilités de la période, la plus proche d'abord, et l'appli parle en « nous » (Gaétan, 17/11).
// Avant : un seul jour « à deux » (le dernier) et un seul jour par personne, ce qui cachait « Mathilde aujourd'hui ».
function conseilCourses(semCible) {
  const d = cgData(); if (!d) return "";
  const today = todayISO(), deb = addDays(semCible, -7) > today ? addDays(semCible, -7) : today, fin = addDays(semCible, -1);
  const J = gardeJours(d, 0).filter(g => g.date >= deb && g.date <= fin);
  if (!J.length) return "";
  const nomJour = g => g.date === today ? "aujourd'hui" : g.date === addDays(today, 1) ? "demain (" + longD(g.date).replace(/ \S+\.?$/, "") + ")" : longD(g.date);
  const liste = T => T.slice(0, 3).map(nomJour).join(" ou ");
  const deux = J.filter(g => libre(g.mathilde) && libre(g.gaetan));
  const mat = J.filter(g => libre(g.mathilde) && !libre(g.gaetan));
  const gae = J.filter(g => libre(g.gaetan) && !libre(g.mathilde));
  const L = [];
  if (mat.length) L.push({ d: mat[0].date, t: `<b>Mathilde</b> : ${esc(liste(mat))} · seule avec Léo, drive conseillé` });
  if (deux.length) L.push({ d: deux[0].date, t: `<b>Nous deux</b> : ${esc(liste(deux))} · magasin ou drive` });
  if (gae.length) L.push({ d: gae[0].date, t: `<b>Gaétan</b> : ${esc(liste(gae))} · drive ou magasin` });
  if (!L.length) return "";
  L.sort((x, y) => x.d < y.d ? -1 : 1);
  return `<div class="ccons"><div class="ccons-t">📅 Qui peut faire les courses</div>${L.map(x => `<div>${x.t}</div>`).join("")}</div>`;
}

// 📅 v1.23 : PLAN PRÉVISIONNEL DES CONGÉS : quand demander les congés d'un voyage
//    Circulaire DGPN du 26 janvier 2022 (plan prévisionnel annuel des départs en congés), point 2 :
//    - plan en 1 période : du 15 mars N au 14 mars N+1, validé au plus tard le 15 mars N ;
//    - plan en 2 périodes : du 15 février au 15 octobre N (validé au plus tard le 15 février N)
//      et du 16 octobre N au 14 février N+1 (validé au plus tard le 15 octobre N) ;
//    - les vœux sont rendus au plus tard 15 jours avant la date de validation.
//    Le choix 1 ou 2 périodes est fait chaque année par le service (CSA) : réglage « Plan prévisionnel du service »
//    dans Paramètres du fichier congés (« 1 », « 2 » ou vide = inconnu : on prend la date la plus tôt des deux).
//    À ne pas confondre avec la « période » des HP (1er mai – 31 octobre), qui ne sert qu'aux jours hors période.
// =====================================================================
const MOIS_L = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const moisAnMaj = iso => { const m = MOIS_L[Number(iso.slice(5, 7)) - 1]; return m[0].toUpperCase() + m.slice(1) + " " + iso.slice(0, 4); };
const isoJ = (a, m, j) => a + "-" + String(m).padStart(2, "0") + "-" + String(j).padStart(2, "0");
// le plan qui couvre une date, pour un mode donné (1 ou 2 périodes)
function planCouvrant(iso, mode) {
  const a = Number(iso.slice(0, 4)), md = iso.slice(5);
  if (mode === 1) {
    const n = md >= "03-15" ? a : a - 1;
    return { mode: 1, nom: "plan " + n + "-" + (n + 1), du: isoJ(n, 3, 15), au: isoJ(n + 1, 3, 14), valid: isoJ(n, 3, 15) };
  }
  if (md >= "02-15" && md <= "10-15") return { mode: 2, nom: "1re période " + a, du: isoJ(a, 2, 15), au: isoJ(a, 10, 15), valid: isoJ(a, 2, 15) };
  const n = md >= "10-16" ? a : a - 1;
  return { mode: 2, nom: "2e période " + n + "-" + (n + 1), du: isoJ(n, 10, 16), au: isoJ(n + 1, 2, 14), valid: isoJ(n, 10, 15) };
}
// ce qu'il faut savoir pour un séjour du « dep » au « ret »
function planPourSejour(dep, ret, d) {
  const reg = String((d && d.plan) || "").trim(), mode = /^1/.test(reg) ? 1 : /^2/.test(reg) ? 2 : 0;
  const cas = (mode ? [mode] : [2, 1]).map(m => { const p = planCouvrant(dep, m); p.voeux = addDays(p.valid, -15); return p; });
  const tot = cas.slice().sort((x, y) => x.voeux < y.voeux ? -1 : 1)[0];
  const billets = addDays(dep, -335);   // ≈ 11 mois avant le départ
  const enPeriode = dep.slice(5) >= "05-01" && dep.slice(5) <= "10-31" && (ret || dep).slice(5) <= "10-31";
  const j = ret ? joursOuvres(dep, addDays(ret, -1), d) : 0;
  return { mode, cas, tot, billets, enPeriode, j };
}
const dLong = iso => { const x = dOf(iso); return x.getDate() + " " + MOIS_L[x.getMonth()] + " " + x.getFullYear(); };
function planVoyageHtml(t, d, court) {
  if (!t.dep) return "";

  const modes = P.mode ? `Plan de ton service en ${P.mode} période${P.mode > 1 ? "s" : ""} : ${esc(P.tot.nom)} (du ${esc(dateCourte(P.tot.du))} au ${esc(dateCourte(P.tot.au))}).`
    : `Ton service n'est pas encore indiqué (1 ou 2 périodes) : ${P.cas.map(c => (c.mode === 2 ? "en 2 périodes, vœu avant le " : "en 1 période, vœu avant le ") + esc(dateCourte(c.voeux))).join(" ; ")}. Date retenue : la plus tôt.`;
  const lignes = [
    `<b>Vœu à rendre au plus tard le ${esc(dLong(P.tot.voeux))}</b> · plan validé au plus tard le ${esc(dLong(P.tot.valid))}.`,
    esc(etat),

    `Billets : réservables vers ${esc(MOIS_L[dOf(P.billets).getMonth()])} ${dOf(P.billets).getFullYear()} (11 mois avant), donc avant la validation. Prends un tarif modifiable, ou attends la validation : l'assurance « congés modifiés par l'employeur » demande en général des congés déjà accordés à l'achat.`,
    P.j ? `Environ ${P.j} jour${P.j > 1 ? "s" : ""} ouvré${P.j > 1 ? "s" : ""} à poser du ${esc(dateCourte(t.dep))} au ${esc(dateCourte(addDays(t.ret, -1)))} (dates à affiner).` : "",
    P.enPeriode ? "Séjour entre le 1er mai et le 31 octobre : ces CA ne comptent pas pour les jours hors période (HP)." : "Une partie du séjour est hors du 1er mai – 31 octobre : ces CA comptent pour les jours hors période (HP)."
  ].filter(Boolean);
  if (court) return `<div class="hint" style="margin-top:6px;line-height:1.45">📅 ${lignes[0]}<br>${lignes[1]}</div>`;
  return `<div class="card" style="padding:12px 14px"><b>${esc(t.ic || "✈️")} ${esc(t.nom)} · ${esc(moisAnMaj(t.dep))}</b>${lignes.map(l => `<div class="hint" style="margin:6px 0 0;line-height:1.45">${l}</div>`).join("")}</div>`;
}

function planCongesHtml(d) {

function planAccueil() {

// ---------- chargement ----------
async function chargerStats(force) {
  if (!configured() || !navigator.onLine) return;
  if (!force && S.st && Date.now() - S.st.at < 30 * 60000) return;
  if (chargerStats.busy) return; chargerStats.busy = true;
  try {
    const r = await call("stats", { force: !!force }, 90000);
    if (r.ok) { S.st = { data: r.stats, at: Date.now() }; LS.set("bf.st", S.st); S.stErreur = ""; }
    else S.stErreur = r.error || "calcul impossible";
  } catch (e) { S.stErreur = e.name === "AbortError" ? "le calcul prend trop de temps, réessaie dans une minute" : e.message; }
  chargerStats.busy = false;
  if ((S.tab === "stats" || (S.tab === "repas" && S.rp.sub === "stats")) && !$("#sheet").classList.contains("open")) render();
}

// ---------- note des courses (façon Nutri-Score) ----------
// 100 points : grignotage et sodas (30), fruits et légumes (20), budget alimentaire par semaine (30), passages en magasin (20)
const lim = (x, a, b) => Math.max(0, Math.min(1, (x - a) / (b - a)));
function noteCourses(o) {
  const food = o.alim + o.malbouffe + o.alcool;
  if (!(food > 0)) return null;
  const m = o.malbouffe / food * 100, f = o.fl / food * 100, sem = Math.max(o.semaines, 0.5);
  const parSem = food / sem, ratio = parSem / (o.objectif || 70), vis = o.tickets / sem;
  const crit = [
    { nom: "Grignotage et sodas", pts: Math.round(30 * lim(35 - m, 0, 25)), max: 30, txt: `${Math.round(m)} % de ta dépense alimentaire`, conseil: "objectif : moins de 10 %" },
    { nom: "Fruits et légumes", pts: Math.round(20 * lim(f, 2, 12)), max: 20, txt: `${Math.round(f)} % de ta dépense alimentaire`, conseil: "objectif : 12 % ou plus" },
    { nom: "Budget nourriture", pts: Math.round(30 * lim(2 - ratio, 0, 1)), max: 30, txt: `${e0(parSem)} par semaine pour ${e0(o.objectif || 70)} prévus`, conseil: "objectif : rester sous ton budget" },
    { nom: "Passages en magasin", pts: Math.round(20 * lim(3 - vis, 0, 2)), max: 20, txt: `${(Math.round(vis * 10) / 10).toString().replace(".", ",")} par semaine`, conseil: "objectif : 1 grosse course par semaine" }
  ];
  const score = crit.reduce((s, c) => s + c.pts, 0);
  const lettre = score >= 80 ? "A" : score >= 65 ? "B" : score >= 50 ? "C" : score >= 35 ? "D" : "E";
  return { score, lettre, crit };
}
// note d'un ticket seul : grignotage (60) et fruits et légumes (40)
function noteTicket(t) {
  if (!(t.net > 0)) return null;
  const s = Math.round(60 * lim(35 - t.malbouffe, 0, 25) + 40 * lim(t.fl, 2, 12));
  return s >= 80 ? "A" : s >= 65 ? "B" : s >= 50 ? "C" : s >= 35 ? "D" : "E";
}
const NS_COUL = { A: "#038141", B: "#85bb2f", C: "#fecb02", D: "#ee8100", E: "#e63e11" };
const lettreHtml = (l, petit) => l ? `<span class="nsl ${petit ? "pt" : ""}" style="background:${NS_COUL[l]};color:${l === "C" ? "#3b3200" : "#fff"}">${l}</span>` : "";

}

function semainesDuMois(ym, dernierJour) {
  const [y, m] = ym.split("-").map(Number), nb = new Date(y, m, 0).getDate();
  const fin = dernierJour && dernierJour.slice(0, 7) === ym ? Number(dernierJour.slice(8, 10)) : nb;

}

// ---------- bourse ----------
function boMoisCourant(d) { const ym = todayISO().slice(0, 7); return (d.mois || []).find(m => m.m === ym) || null; }
const addMois = (ym, k) => { let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + k; while (m < 0) { m += 12; y--; } while (m > 11) { m -= 12; y++; } return y + "-" + pad(m + 1); };

// fenêtre « J'ai fait mon DCA » : versement et/ou achat, frais calculés (0 jusqu'à 500 €, 0,35 % au-delà)
function fraisOrdre(montant) { return montant > 500 ? Math.round(montant * 0.0035 * 100) / 100 : 0; }
function dcaResume(k) {
  if (!(k.parts > 0 && k.prix > 0)) return k.maxParts ? `Avec ${eur(k.dispo)} disponibles, tu peux acheter jusqu'à ${k.maxParts} parts.` : "";
  return `Ordre de ${eur(k.ordre)} · frais ${k.frais ? eur(k.frais) + " (0,35 %, ordre de plus de 500 €)" : "0 € (ordre jusqu'à 500 €)"} · coût ${eur(k.cout)}${k.dispo ? ` · il resterait ${eur(Math.round((k.dispo - k.cout) * 100) / 100)} d'espèces` : ""}`;
}

  } catch (e) { box.innerHTML = `<b>🩺 État de l'appli</b><div class="hint">⚠ ${esc(e.message)}</div>`; return; }
  const s = S.sante, dn = s.dernier;

  box.innerHTML = `<b>🩺 État de l'appli</b>

    <div class="hint">${s.quotidien ? "Contrôle automatique chaque matin" + (s.mail ? ", mail seulement en cas de problème." : " (sans mail).") : "Contrôle automatique pas encore activé : dans le Sheet, menu 🛠️ Gestion Budget → 🩺 Activer le contrôle quotidien (une fois)."}</div>
    ${s.erreurs.length ? `<details><summary>Dernières erreurs notées (${s.erreurs.length})</summary><ul class="ings">${s.erreurs.map(x => `<li style="${x.vue || x.mineure ? "opacity:.55" : ""}"><span style="text-align:left;flex:1">${d2(x.d)} · ${esc(x.ou)}${x.mineure ? " · sans gravité" : x.vue ? " · vue" : ""}<br><small>${esc(x.msg)}</small></span></li>`).join("")}</ul></details>` : ""}

// v1.26 : combien d'ouvertures de l'appli ont trouvé l'état déjà prêt aujourd'hui
function vitesseHtml(v) {
  if (!v || v.jour !== todayISO()) return "";
  const tot = (v.cache || 0) + (v.calcul || 0); if (!tot) return "";
  return `<div class="hint">⚡ Aujourd'hui : ${v.cache || 0} chargement(s) rapide(s) sur ${tot}${v.calcul ? ` · ${v.calcul} lent(s) (calcul complet)` : ""} · ${v.avance || 0} préparé(s) à l'avance</div>`;
}

// =====================================================================
const V19_TYPES = ["tache", "placard", "salaire", "moisrep", "paiedates", "objectif"];
const P_NOM = p => p === "M" ? "Mathilde" : "Gaétan";
const LIB_COMPTE = { "CTO Léo": "CTO Gaétan · pour Léo" };
const libCompte = c => LIB_COMPTE[c] || c;

const lendemain = () => addDays(todayISO(), 1);

function v19Norm(x) {
  x = x || {};
  x.mois = x.mois || {}; x.mois.sal = x.mois.sal || {}; x.mois.sal.G = x.mois.sal.G || []; x.mois.sal.M = x.mois.sal.M || [];
  x.mois.rep = x.mois.rep || {}; x.mois.fait = x.mois.fait || {}; x.mois.b7 = x.mois.b7 || {};
  x.taches = x.taches || []; x.placard = x.placard || {}; ["manque", "ajouts", "retires"].forEach(k => { x.placard[k] = x.placard[k] || []; });
  return x;
}
// état v1.9 (petit) : celui du script + les opérations pas encore envoyées
function v19(v) {
  if (v) return (v.v19 = v19Norm(v.v19));
  const vv = { v19: v19Norm(JSON.parse(JSON.stringify((S.base && S.base.v19) || {}))) };
  S.queue.forEach(op => { if (V19_TYPES.includes(op.type)) v19Apply(vv, op); });
  return vv.v19;
}
const v19Pret = () => !!(S.base && S.base.v19);
// affichage immédiat des opérations en attente
function v19Apply(v, op) {
  const p = op.payload; if (!v.v19) return;
  const x = v19(v);
  if (op.type === "objectif") { x.objectifs = Object.assign({}, x.objectifs); if (p.efface) delete x.objectifs[p.compte]; else x.objectifs[p.compte] = { date: p.date || "", cible: Number(String(p.cible || 0).replace(",", ".")) || 0, mensuel: p.mensuel === "" || p.mensuel == null ? null : Number(String(p.mensuel).replace(",", ".")), taux: p.taux === "" || p.taux == null ? 7 : Number(String(p.taux).replace(",", ".")) }; return; }
  if (op.type === "paiedates") { x.paie = x.paie || { G: {}, M: {} }; const q = p.qui === "M" ? "M" : "G"; x.paie[q] = Object.assign({}, x.paie[q]); if (p.efface) delete x.paie[q][String(p.an)]; else x.paie[q][String(p.an)] = p.jours; return; }
  if (op.type === "tache") {
    if (p.op === "add") x.taches.push({ id: p.tid, txt: p.txt, pour: p.pour, ajout: todayISO(), par: p.par, quand: p.quand || "", faite: "", fpar: "" });
    const t = x.taches.find(y => y.id === p.tid); if (!t) return;
    if (p.op === "fait") { t.faite = todayISO(); t.fpar = p.par; }
    else if (p.op === "defait") { t.faite = ""; t.fpar = ""; }
    else if (p.op === "suppr") x.taches = x.taches.filter(y => y.id !== p.tid);
    else if (p.op === "modif") Object.assign(t, { txt: p.txt || t.txt, pour: p.pour, quand: p.quand || "" });
  } else if (op.type === "placard") {
    const pl = x.placard, n = p.n;
    if (p.op === "etat") { pl.manque = pl.manque.filter(y => y !== n); if (p.manque) pl.manque.push(n); }
    else if (p.op === "plein") pl.manque = pl.manque.filter(y => !(p.liste || []).includes(y));
    else if (p.op === "ajout") { pl.ajouts = pl.ajouts.filter(y => y.n !== n).concat({ n, g: p.g }); pl.retires = pl.retires.filter(y => y !== n); }
    else if (p.op === "retrait") { pl.ajouts = pl.ajouts.filter(y => y.n !== n); pl.manque = pl.manque.filter(y => y !== n); pl.retires.push(n); }
    else if (p.op === "defaut") x.placard = { manque: [], ajouts: [], retires: [] };
  } else if (op.type === "salaire") {
    const l = x.mois.sal[p.qui] = x.mois.sal[p.qui].filter(s => s.per !== p.per);
    l.push({ per: p.per, d: p.date, mont: p.mont, cible: "", applique: false });
  } else if (op.type === "moisrep") {
    if (p.fait) x.mois.fait[p.k] = p.date || todayISO();
    else if (p.jusqu) x.mois.rep[p.k] = p.jusqu;
    else { delete x.mois.rep[p.k]; delete x.mois.fait[p.k]; }
  }
  v.v19 = x;
}

// ---------- bourse : vue par profil et état de chaque compte depuis le dernier salaire ----------
function boVue(d, P) {
  if (!d) return null;
  const ok = P === "M" ? (c => /Mathilde/i.test(c) || /^CTO/i.test(c)) : (c => !/Mathilde/i.test(c));
  return Object.assign({}, d, { positions: d.positions.filter(p => ok(p.compte)), comptes: d.comptes.filter(c => ok(c.compte)), ops: d.ops.filter(o => ok(o.compte)) });
}
const comptesDe = P => P === "M" ? ["PEA Mathilde", "CTO Léo"] : ["PEA Gaëtan", "CTO Léo"];
const quiOk = (P, q) => P === "M" ? /Mathilde|deux/i.test(q || "") : /Ga[eéë]tan|deux/i.test(q || "");
function compteEtat(d, P, compte, depuis) {
  const ops = (d.ops || []).filter(o => o.compte === compte && o.d >= depuis && !/^Position de départ/.test(o.rem || "") && !estBonus113(o));
  const vers = ops.filter(o => o.op === "Versement" && (/^PEA/.test(compte) || quiOk(P, o.qui)));
  const ach = ops.filter(o => o.op === "Achat");
  const ok = /^PEA/.test(compte) ? (vers.length + ach.length > 0) : vers.length > 0;
  const der = ops.filter(o => vers.includes(o) || ach.includes(o)).map(o => o.d).sort().pop() || "";
  return { ok, verse: vers.reduce((s, o) => s + (o.verse || 0), 0), achete: ach.reduce((s, o) => s + (o.cout || 0), 0), d: der };
}
function comptesActifs(d, P) { return comptesDe(P).filter(c => d.positions.some(p => p.compte === c) || (d.comptes.find(z => z.compte === c) || {}).total > 0); }
function depuisCompte(P) { const s = dernierSalaire(P); return s && (Date.parse(todayISO()) - Date.parse(s.d)) / 86400000 <= 35 ? s.d : todayISO().slice(0, 8) + "01"; }
function prevuCompte(d, compte, s) {
  const ym = s ? (Number(s.d.slice(8, 10)) >= 20 ? addMois(s.d.slice(0, 7), 1) : s.d.slice(0, 7)) : todayISO().slice(0, 7);
  const m = (d.mois || []).find(z => z.m === ym); if (!m) return 0;
  return compte === "PEA Gaëtan" ? m.peaPrevu : /^CTO/.test(compte) ? m.ctoPrevu : 0;
}
function etatComptesHtml(d, P) {
  const dep = depuisCompte(P), s = dernierSalaire(P), lignes = comptesActifs(d, P).map(c => {
    const e = compteEtat(d, P, c, dep), f = s && v19().mois.fait[P + "." + c + "." + s.per];
    return `<div class="row"><div class="ic">${e.ok || f ? "✅" : "⏳"}</div><div class="rt"><b>${esc(libCompte(c))}</b><span>${e.ok ? "fait le " + dateCourte(e.d) + (e.verse ? " · " + eur(e.verse) + " versés" : "") + (e.achete ? " · " + eur(e.achete) + " investis" : "") : f ? "noté comme fait" : "en attente" + (prevuCompte(d, c, s) ? " · " + eur(prevuCompte(d, c, s)) + " prévus" : "")}</span></div>${e.ok || f ? "" : `<button class="mini" data-bodca="${esc(c)}" style="width:auto;padding:0 10px">Fait</button>`}</div>`;
  });
  if (!lignes.length) return "";

// ---------- ponts : plus proposés s'ils commencent aujourd'hui ou avant, ni si les jours sont déjà en congé/repos ----------
function pontsAVenir(d) {
  const today = todayISO(), m0 = today.slice(0, 7), m1 = addDays(m0 + "-28", 7).slice(0, 7);
  const poses = (d.demandes || []).filter(x => !x.annule);
  const garde = {}; (d.garde || []).forEach(g => { garde[g[0]] = g[2]; });
  const dejaLibre = p => { let j = p.du, n = 0; while (j <= p.au && n < 40) { const s = garde[j]; if (s === undefined || /travail/i.test(s)) return false; j = addDays(j, 1); n++; } return n > 0; };
  return (d.ponts || []).filter(p => p.du > today && (p.du.slice(0, 7) === m0 || p.du.slice(0, 7) === m1)).map(p => {
    const fait = d.ponts_etat[p.occ] === "fait" || poses.some(x => x.du <= p.au && x.au >= p.du) || dejaLibre(p);
    return Object.assign({}, p, { fait, refus: d.ponts_etat[p.occ] === "non", quand: p.du.slice(0, 7) === m0 ? "Ce mois-ci" : "Le mois prochain" });
  }).filter(p => !p.refus);
}

const v110Pret = () => !!(S.base && S.base.v110) && (Number(S.base.scriptVersion) || 0) >= 27;
const moiNom = () => S.roleM ? "Mathilde" : "Gaétan";

// ---------- contexte ajouté tout seul ----------
function noterErreur(msg) { S.derErr = { d: new Date().toISOString(), msg: String(msg).slice(0, 200) }; LS.set("bf.derr", S.derErr); }
window.addEventListener("error", e => { try { noterErreur((e.message || "erreur") + " (" + (e.filename || "").split("/").pop() + ":" + (e.lineno || "") + ")"); } catch (x) {} });
window.addEventListener("unhandledrejection", e => { try { noterErreur("promesse : " + ((e.reason && (e.reason.message || e.reason)) || "rejet")); } catch (x) {} });
function erreurRecente() {
  const e = S.derErr; if (!e || !e.d) return "";
  const t = Date.parse(e.d); if (!t || Date.now() - t > 24 * 3600000) return "";
  const d = new Date(t);
  return e.msg + " (" + (d.toDateString() === new Date().toDateString() ? "" : dateCourte(e.d.slice(0, 10)) + " ") + String(d.getHours()).padStart(2, "0") + "h" + String(d.getMinutes()).padStart(2, "0") + ")";
}
function ecranNom() {
  let e = NOMS_ONGLETS[S.tab] || S.tab;
  if (S.tab === "repas" && S.rp) e += " › " + (SOUS_REPAS[S.rp.sub] || S.rp.sub);
  if (S.tab === "home" && S.who && S.who !== "Commun") e += " › " + S.who;
  if (S.derFen && Date.now() - S.derFen.at < 5 * 60000) e += " · après la fenêtre « " + S.derFen.t + " »";
  return e + " · profil " + profCode() + (S.roleM ? " (téléphone de Mathilde)" : "");
}

// ---------- liste : celle du script + les envois en attente ----------
function idees() {
  const L = JSON.parse(JSON.stringify((S.base && S.base.v110 && S.base.v110.idees) || []));
  S.queue.forEach(op => {
    if (op.type !== "idee") return;
    const p = op.payload;
    if (p.op === "add") { if (!L.some(x => x.id === p.iid)) L.push({ id: p.iid, d: p.dloc || p.quand.slice(0, 16), qui: moiNom(), type: p.type, txt: p.txt, ecran: p.ecran, cap: p.capture ? "attente" : "", statut: "envoi", ver: "", rep: "" }); return; }
    const x = L.find(y => y.id === p.iid); if (!x) return;
    if (p.op === "modif") { x.txt = p.txt || x.txt; x.type = p.type || x.type; }
    if (p.op === "suppr") L.splice(L.indexOf(x), 1);
  });
  return L;
}
const ideeMienne = x => x.qui === moiNom();
const ideeFinie = x => /^(corrigée|non retenue)/.test(x.statut);
const ideeSig = x => x.statut + "|" + x.ver + "|" + x.rep;
function ideeStatut(x) {
  const v = x.ver ? " en " + esc(x.ver.replace(/^v?/, "v")) : "";
  if (x.statut === "envoi") return `<span class="ids env">⏳ en attente d'envoi</span>`;
  if (x.statut === "nouvelle") return `<span class="ids nv">🆕 pas encore lue</span>`;
  if (x.statut === "vue") return `<span class="ids vu">👀 vue par Claude</span>`;
  if (x.statut === "prévue") return `<span class="ids pr">🗓 prévue${v}</span>`;
  if (x.statut === "corrigée") return `<span class="ids ok">✅ ${x.type === "bug" ? "corrigée" : x.type === "question" ? "répondue" : "faite"}${v}</span>`;
  if (x.statut === "non retenue") return `<span class="ids no">✖ non retenue</span>`;
  return `<span class="ids vu">${esc(x.statut)}${v}</span>`;
}
const ideeIc = t => (IDEE_TYPES.find(y => y[0] === t) || IDEE_TYPES[1])[1];
const ideeDate = d => d ? dateCourte(d.slice(0, 10)) + (d.length > 11 ? " " + d.slice(11, 16).replace(":", "h") : "") : "";
function ideeLigne(x) {
  return `<div class="idee" data-ib="${esc(x.id)}"><div class="idic">${ideeIc(x.type)}</div><div class="rt"><b>${esc(x.txt || "(capture seule)")}</b>
    <span>${ideeDate(x.d)}${!ideeMienne(x) ? " · " + esc(x.qui) : ""}${x.cap ? " · 📎" : ""} · ${ideeStatut(x)}</span>
    ${x.rep ? `<div class="iderep">🤖 ${esc(x.rep)}</div>` : ""}</div></div>`;
}

// ---------- fenêtre « 💡 » ----------
function openIdee() {
  if (!configured() || !S.base) { toast("Configure d'abord la connexion"); return; }
  if (!v110Pret()) { toast("Mets d'abord à jour le script du Sheet (version 27)"); return; }
  if (!S.ibOuvert) S.ibCtx = { ecran: ecranNom(), err: erreurRecente() };
  S.ibOuvert = true;
  const c = S.ibCtx, n = idees().filter(ideeMienne).length;
  openSheet(`<h3>💡 Boîte à idées</h3>
    <div class="tchips">${IDEE_TYPES.map(([k, ic, nom]) => `<button class="cat ${S.ib.type === k ? "on" : ""}" data-ibtype="${k}">${ic} ${nom}</button>`).join("")}</div>
    <textarea id="ibTx" class="ibtx" rows="4" placeholder="${esc(IDEE_AIDE[S.ib.type])}">${esc(S.ib.txt || "")}</textarea>
    <div class="hint">Tu peux dicter avec le micro du clavier. Le texte reste en brouillon si tu fermes.</div>
    <div id="ibCap">${ideeCapHtml()}</div>
    <div class="ibctx">📎 Joint tout seul : ${esc(c.ecran)} · appli ${esc(APP_VERSION)} · script ${Number(S.base.scriptVersion) || "?"}${c.err ? `<br>⚠ Dernière erreur : ${esc(c.err)}` : ""}</div>
    <button class="btn" data-v110="ibsend">Envoyer</button>
    <button class="linkbtn" data-v110="ibliste">📋 ${S.roleM ? "Mes remarques" : "Voir les remarques"} (${n}) ›</button>`);
  setTimeout(() => { const t = $("#ibTx"); if (t && !S.ib.txt) t.focus(); }, 250);
}
function ideeCapHtml() {
  const c = S.ib.cap;
  if (c) return `<div class="ibcap"><img src="data:${c.mime};base64,${c.data}" alt="capture"><div><b>Capture jointe</b><span>${Math.round(c.data.length * 0.75 / 1024)} Ko</span><button class="linkbtn" data-v110="ibcapx">✕ Retirer</button></div></div>`;
  return `<button class="btn sec" data-v110="ibcap">📷 Joindre une capture d'écran</button>
    <div class="hint">Fais d'abord la capture avec les boutons du téléphone (marche + volume bas), puis choisis-la ici dans ta galerie.</div>`;
}
async function ideeCapLire(f) {
  if (!f) return;
  try {
    const im = await loadImage(f);
    let cote = 1600, q = 0.72, data = "";
    for (let essai = 0; essai < 4; essai++) {
      const k = Math.min(1, cote / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      data = cv.toDataURL("image/jpeg", q).split(",")[1];
      if (data.length < 600000) break;
      cote = Math.round(cote * 0.8); q = Math.max(0.5, q - 0.08);
    }
    S.ib.cap = { mime: "image/jpeg", data };
    const el = $("#ibCap"); if (el) el.innerHTML = ideeCapHtml();
  } catch (e) { toast("⚠ Image illisible : " + e.message); }
}
function envoyerIdee() {
  const tx = $("#ibTx"), txt = ((tx ? tx.value : S.ib.txt) || "").trim();
  if (!txt && !S.ib.cap) { toast("Écris ta remarque (ou joins une capture)"); return; }
  if (!v110Pret()) { toast("Mets d'abord à jour le script du Sheet (version 27)"); return; }
  const c = S.ibCtx || { ecran: ecranNom(), err: erreurRecente() };
  const p = { op: "add", iid: "I" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), type: S.ib.type, txt, ecran: c.ecran, app: APP_VERSION, erreur: c.err, quand: new Date().toISOString(), dloc: todayISO() + " " + new Date().toTimeString().slice(0, 5) };
  if (S.ib.cap) p.capture = { mime: S.ib.cap.mime, data: S.ib.cap.data };
  S.ib.txt = ""; S.ib.cap = null; saveIb();
  closeSheet();
  enqueue("idee", p);
  let garde = true;
  try { localStorage.setItem("bf.queue", JSON.stringify(S.queue)); } catch (e) { garde = false; }
  if (!garde) toast("⚠ Remarque notée, mais la capture est trop lourde pour attendre le réseau : laisse l'appli ouverte jusqu'à l'envoi");
  else toast(navigator.onLine ? "💡 Merci, c'est noté" : "💡 Notée : elle partira dès que le réseau revient");
}

function viewIdees() {
