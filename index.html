// =====================================================================
// v1.11.0 : ✈️ VOYAGES : budget par voyage (marge sur l'estimé), épargne, effort mensuel, calendrier de paiements,
//           fiches (idées, cuisine locale, pièges, astuces, réservations) avec photos libres de droits.
//           Règle : chaque voyage a sa propre cagnotte et son propre effort : un nouveau voyage n'en retarde aucun autre.
// =====================================================================
const V111_TYPES = ["voyage"];
NOMS_ONGLETS.voyages = "Voyages";
const VOY_PCT = { "tarif vu": 5, "réservé": 0 };         // marge selon la fiabilité ; « estimé » = marge du voyage (20 % par défaut)
const VOY_FIABS = [["estimé", "Estimé"], ["tarif vu", "Tarif vu"], ["réservé", "Réservé"]];
const VOY_STATS = [["idée", "💭 Idée"], ["prévu", "🗓 Prévu"], ["réservé", "✅ Réservé"], ["fait", "🏁 Fait"]];
const VOY_SECS = [["budget", "💶 Budget"], ["cal", "📅 Calendrier"], ["idees", "🎯 Idées"], ["conseils", "⚠ Conseils"]];
const VOY_TYPE_IC = { "poste": "💶", "activité": "🎯", "cuisine": "🍽", "piège": "⚠️", "réservation": "📅", "astuce": "💡", "levier": "✂️" };
S.vy = Object.assign({ id: null, sec: "budget" }, LS.get("bf.vy", {}), { id: null });
const saveVy = () => LS.set("bf.vy", { sec: S.vy.sec });
const v111Pret = () => !!(S.base && S.base.v111) && (Number(S.base.scriptVersion) || 0) >= 28;
const MOIS_C = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
// v1.23 : mois en toutes lettres avec majuscule (« Mai 2028 », « Août 2027 ») : les dates exactes des voyages sont encore des hypothèses
const moisAn = iso => { if (!iso) return ""; const m = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"][Number(iso.slice(5, 7)) - 1]; return m[0].toUpperCase() + m.slice(1) + " " + iso.slice(0, 4); };
const eur0 = n => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Math.round(Number(n) || 0));

// ---------- données : celles du script + les modifications en attente ----------
const pickK = (o, ks) => ks.reduce((r, k) => { if (o[k] != null) r[k] = o[k]; return r; }, {});
const TRIP_K = ["nom", "ic", "dep", "ret", "ad", "en", "statut", "epargne", "marge", "notes"], LIG_K = ["type", "cat", "lib", "mont", "fiab", "date", "fait", "note", "photoq", "lien"];
function voyApply(V, p) {
  const t = V.voyages.find(x => x.id === p.vid), l = V.lignes.find(x => x.id === p.lid && x.v === p.vid);
  if (p.op === "cfg") { if (p.capacite != null) V.cfg.capacite = Number(p.capacite) || 0; if (p.ldds != null) V.cfg.ldds = Number(p.ldds) || 0; }
  else if (p.op === "tripadd") { if (!t) V.voyages.push(Object.assign({ id: p.vid, nom: "", ic: "✈️", dep: "", ret: "", ad: 2, en: 0, statut: "idée", epargne: 0, marge: 20, notes: "" }, pickK(p, TRIP_K))); }
  else if (p.op === "tripmod") { if (t) Object.assign(t, pickK(p, TRIP_K)); }
  else if (p.op === "verse") { if (t) t.epargne = Math.round((t.epargne + (Number(p.mont) || 0)) * 100) / 100; }
  else if (p.op === "tripdel") { V.voyages = V.voyages.filter(x => x.id !== p.vid); V.lignes = V.lignes.filter(x => x.v !== p.vid); }
  else if (p.op === "ligadd") { if (!l) V.lignes.push(Object.assign({ v: p.vid, id: p.lid, type: "poste", cat: "", lib: "", mont: 0, fiab: "estimé", date: "", fait: false, note: "", photo: "", credit: "", lien: "" }, pickK(p, LIG_K))); }
  else if (p.op === "ligmod") { if (l) Object.assign(l, pickK(p, LIG_K)); }
  else if (p.op === "ligdel") { V.lignes = V.lignes.filter(x => !(x.id === p.lid && x.v === p.vid)); }
}
function voy() {
  const b = (S.base && S.base.v111) || {};
  const V = JSON.parse(JSON.stringify({ voyages: b.voyages || [], lignes: b.lignes || [], cfg: b.cfg || {}, photosManquantes: b.photosManquantes || 0 }));
  S.queue.forEach(op => { if (op.type === "voyage") voyApply(V, op.payload); });
  V.voyages.sort((a, b2) => (a.dep || "9999") < (b2.dep || "9999") ? -1 : 1);
  return V;
}

// ---------- calculs (purs) ----------
const pctDe = (l, t) => l.fiab === "estimé" ? (Number(t.marge) || 0) : (VOY_PCT[l.fiab] || 0);
const avecMarge = (l, t) => (Number(l.mont) || 0) * (1 + pctDe(l, t) / 100);
function voyCalc(V, t, today) {
  today = today || todayISO();
  const P = V.lignes.filter(l => l.v === t.id && l.type === "poste");
  const base = P.reduce((s, l) => s + (Number(l.mont) || 0), 0), total = P.reduce((s, l) => s + avecMarge(l, t), 0);
  const reste = Math.max(0, total - (t.epargne || 0));
  const dflt = t.dep || addDays(today, 365);
  const ech = P.map(l => ({ l, d: l.date || dflt, m: avecMarge(l, t) })).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  let cum = 0, need = 0;
  ech.forEach(x => {
    cum += x.m;
    x.cum = cum; x.mois = Math.max(1, (dOf(x.d) - dOf(today)) / 86400000 / 30.44);
    need = Math.max(need, (cum - (t.epargne || 0)) / x.mois);
  });
  const effort = reste <= 0.5 ? 0 : Math.ceil(need);
  ech.forEach(x => { x.pot = (t.epargne || 0) + effort * x.mois; });
  const moisDep = t.dep ? Math.max(0, Math.round((dOf(t.dep) - dOf(today)) / 86400000 / 30.44)) : null;
  return { base, total, marge: total - base, reste, effort, ech, moisDep, pct: total > 0 ? Math.min(100, Math.round((t.epargne || 0) / total * 100)) : 0 };
}
const voyActif = (t, today) => t.statut !== "fait" && (!t.dep || t.dep >= (today || todayISO()));
// effort cumulé dans le temps : à chaque départ, l'effort de ce voyage s'arrête et celui des autres continue
function voyPlan(V, today) {
  today = today || todayISO();
  const A = V.voyages.filter(t => voyActif(t, today)).map(t => ({ t, c: voyCalc(V, t, today) })).filter(x => x.c.effort > 0);
  const deps = [...new Set(A.map(x => x.t.dep || "9999-12-31"))].sort();
  let debut = today; const seg = [];
  deps.forEach(d => {
    const parts = A.filter(x => (x.t.dep || "9999-12-31") >= d).map(x => ({ nom: x.t.nom, ic: x.t.ic, eff: x.c.effort }));
    seg.push({ du: debut, au: d, total: parts.reduce((s, p) => s + p.eff, 0), parts });
    debut = d;
  });
  return { seg, pic: seg.length ? seg[0].total : 0, A };
}
// v1.24 : ce qu'on peut retirer du LDDS sans qu'aucun mois à venir de l'onglet Prélèvements Annuel passe sous le seuil
// = solde prévu le plus bas des mois à venir − seuil (et non plus le solde d'aujourd'hui − seuil)
function lddsSurplus() {
  const v = computeView(), l = v && v.ldds; if (!l || !(l.soldeReel > 0)) return null;
  const est = l.soldeEstime != null ? l.soldeEstime : l.soldeReel, seuil = Number(l.seuil) || 0;
  const bas = typeof l.plusBas === "number" ? Math.min(l.plusBas, est) : est;
  return { est, seuil, bas, basMois: l.plusBasMois || "", surplus: Math.max(0, Math.round(bas - seuil)) };
}

// ---------- Bourse de Paris (Euronext) : ouverte du lundi au vendredi, 9 h – 17 h 30, sauf jours fériés de la Bourse ----------
function paques(an) {
  const a = an % 19, b = Math.floor(an / 100), c = an % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(an, mois - 1, jour));
}
function heureParis(t) {
  const p = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false }).formatToParts(t || new Date());
  const g = k => (p.find(x => x.type === k) || {}).value;
  return { iso: g("year") + "-" + g("month") + "-" + g("day"), min: Number(g("hour")) % 24 * 60 + Number(g("minute")) };
}
function jourBourse(iso) {
  const d = new Date(iso + "T12:00:00Z"), j = d.getUTCDay();
  if (j === 0 || j === 6) return false;
  const an = d.getUTCFullYear(), md = iso.slice(5), pq = paques(an);
  const dec = n => new Date(pq.getTime() + n * 86400000).toISOString().slice(0, 10);
  return !["01-01", "05-01", "12-25", "12-26"].includes(md) && iso !== dec(-2) && iso !== dec(1);
}
function marcheEtat(t) {
  const h = heureParis(t), demi = /-12-(24|31)$/.test(h.iso), fin = demi ? 14 * 60 + 5 : 17 * 60 + 30;
  if (jourBourse(h.iso) && h.min >= 9 * 60 && h.min < fin) return { ouvert: true, txt: "Bourse ouverte · ferme à " + (demi ? "14h05" : "17h30") };
  let d = h.iso, n = 0;
  if (!(jourBourse(d) && h.min < 9 * 60)) { do { d = new Date(new Date(d + "T12:00:00Z").getTime() + 86400000).toISOString().slice(0, 10); n++; } while (!jourBourse(d) && n < 10); }
  const quand = d === h.iso ? "aujourd'hui" : n === 1 ? "demain" : new Intl.DateTimeFormat("fr-FR", { weekday: "long", timeZone: "UTC" }).format(new Date(d + "T12:00:00Z"));
  return { ouvert: false, txt: "Bourse fermée · ouvre " + quand + " à 9h" };
}

// ---------- prénom : « Gaétan » à l'écran, quelle que soit la graphie des données (le fichier des investissements écrit « Gaëtan » dans ses libellés, qui lui servent de clés) ----------
(function () {
  const RE = /Gaëtan/g; let occupe = false;
  const corrige = n => {
    if (!n) return;
    if (n.nodeType === 3) { if (n.nodeValue.indexOf("Gaëtan") >= 0) n.nodeValue = n.nodeValue.replace(RE, "Gaétan"); return; }
    if (n.nodeType !== 1) return;
    const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT); let x;
    while ((x = w.nextNode())) { if (x.nodeValue.indexOf("Gaëtan") >= 0) x.nodeValue = x.nodeValue.replace(RE, "Gaétan"); }
    if (n.title && n.title.indexOf("Gaëtan") >= 0) n.title = n.title.replace(RE, "Gaétan");
  };
  const obs = new MutationObserver(ms => {
    if (occupe) return; occupe = true;
    try { ms.forEach(m => { if (m.type === "characterData") corrige(m.target); else m.addedNodes.forEach(corrige); }); } catch (e) {}
    occupe = false; obs.takeRecords();
  });
  const demarre = () => { corrige(document.body); obs.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.body) demarre(); else document.addEventListener("DOMContentLoaded", demarre);
})();

function motFixe114(lib, fixes) {

  const bas = d.positions.filter(p => p.parts > 0 && p.pru > 0 && p.cours > 0 && p.cours < p.pru);
  if (!bas.length) return "";
  return `<div class="card brs115"><div class="row" style="border:0;padding:0"><div class="ic">📉</div><div class="rt"><b>Sous ton PRU</b>${bas.map(p => `<span>${esc(p.titre)} (${esc(p.compte)}) : cours ${eur(p.cours)} · PRU ${eur(p.pru)} · ${String(Math.round((p.cours / p.pru - 1) * 1000) / 10).replace(".", ",")} %</span>`).join("")}<span>Un investissement bonus est possible depuis l'écran Bourse.</span></div></div></div>`;
}

// ---------- 🔗 adresse de l'appli (pour le lien de Mathilde, dans le menu du Sheet) et quotas ----------
function communiquerAdresse115() {
  if (S.roleM || S.offline || !S.base || !S.base.v115) return;
  const u = location.origin + location.pathname.replace(/[^/]*$/, "");
  if (!/^https:\/\//.test(u)) return;
  const cle = u + "|" + S.cfg.url; if (LS.get("bf.appurl", "") === cle) return;
  LS.set("bf.appurl", cle); enqueue("appurl", { url: u });
}
function quotaInfo115() {
  const V = S.base && S.base.v115; if (!V) return "";
  const Q = V.quota, sec = ms => (ms / 1000).toFixed(0) + " s";
  return (Q && Q.jour ? `<div class="hint">Aujourd'hui côté Sheet : ${Q.n} actualisation${Q.n > 1 ? "s" : ""}, ${sec(Q.ms)} de calcul cumulé${Q.hist && Q.hist.length ? " · hier : " + sec(Q.hist[Q.hist.length - 1].ms) : ""}.</div>` : "")
    + `<div class="hint">🔔 Notifications (contrats à revoir, bourse sous le PRU) : ${V.ntfy ? "actives" : "désactivées · dans le Sheet, menu « 🔔 Notifications (ntfy) »"}.</div>`;
}

// ---------- événements ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-act]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.who) { setWho(t.dataset.who); return; }
  if (t.dataset.addmode) { if (t.dataset.addmode === "entree") openEntree(); else openAdd(); return; }
  if (t.dataset.act === "goso") { S.tab = "soins"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "soinnew") { openSoin(); return; }
  if (t.dataset.act === "entreenew") { openEntree(); return; }
  if (t.dataset.act === "soinrow") { openSoinDetail(t.dataset.id); return; }
  if (t.dataset.filt) { S.soFilter = t.dataset.filt; render(); return; }
  if (t.dataset.spour) { S.form.pour = t.dataset.spour; document.querySelectorAll("#sPour .cat").forEach(b => b.classList.toggle("on", b.dataset.spour === S.form.pour)); return; }
  if (t.dataset.spay) { S.form.payePar = t.dataset.spay; document.querySelectorAll("#sPay .cat").forEach(b => b.classList.toggle("on", b.dataset.spay === S.form.payePar)); return; }
  if (t.dataset.ecat) { S.form.cat = t.dataset.ecat; document.querySelectorAll("#eCats .cat").forEach(b => b.classList.toggle("on", b.dataset.ecat === S.form.cat)); $("#eSoWrap").style.display = S.form.cat === "Soin" ? "" : "none"; return; }
  if (t.dataset.eorg) { S.form.org = t.dataset.eorg; document.querySelectorAll("#eOrg .cat").forEach(b => b.classList.toggle("on", b.dataset.eorg === S.form.org)); renderESoins(); return; }
  if (t.dataset.ecompte) { S.form.compte = t.dataset.ecompte; S.form.compteChoisi = true; document.querySelectorAll("#eCompte .cat").forEach(b => b.classList.toggle("on", b.dataset.ecompte === S.form.compte)); return; }
  if (t.dataset.eso) { toggleESoin(t.dataset.eso); return; }
  if (t.id === "sSave") { saveSoin(); return; }
  if (t.id === "eSave") { saveEntree(); return; }
  if (t.dataset.detape) { S.form.etape = t.dataset.detape; document.querySelectorAll("#dEtapes .cat").forEach(b => b.classList.toggle("on", b.dataset.detape === S.form.etape)); const h = $("#dEtHint"); if (h) h.textContent = ETAPES.find(e => e[0] === S.form.etape)[2]; return; }
  if (t.id === "dSaveNote") { enqueue("soinmaj", { soinId: S.form.id, etape: S.form.etape, note: (S.form.note || "").trim() }); closeSheet(); toast("✔ Suivi enregistré"); return; }
  if (t.id === "dRemb") { const id = S.form.id; openEntree({ cat: "Soin" }); toggleESoin(id); return; }
  if (t.id === "dDel") {
    if (!confirm("Supprimer ce soin du suivi (et de l'onglet Soins du Sheet) ?")) return;
    const id = S.form.id, pend = S.queue.findIndex(o => o.id === id && o.type === "soin");
    if (pend >= 0) { S.queue.splice(pend, 1); saveQueue(); render(); setSync(); } else enqueue("soindel", { soinId: id });
    closeSheet(); toast("Soin supprimé"); return;
  }
  if (t.dataset.payer) { S.form.qui = t.dataset.payer; document.querySelectorAll("#fQui .cat").forEach(b => b.classList.toggle("on", b.dataset.payer === S.form.qui)); const l = $("#fLddsLine"); if (l) l.style.display = S.form.qui === "Commun" ? "flex" : "none"; const pw = $("#fPartWrap"); if (pw) pw.style.display = S.form.qui === "Commun" ? "none" : ""; majPartage(); return; }
  if (t.dataset.fpart) { S.form.part = t.dataset.fpart; majPartage(); if (t.dataset.fpart === "libre") setTimeout(() => { const i = $("#fPartLibre"); if (i) i.focus(); }, 50); return; }
  if (t.dataset.tqui) { S.form.qui = t.dataset.tqui; document.querySelectorAll("#tQui .cat").forEach(b => b.classList.toggle("on", b.dataset.tqui === S.form.qui)); return; }
  if (t.dataset.act === "carteTP") { carteTpOuvrir(); return; }
  if (t.dataset.act === "ctpFermer") { closeSheet(); return; }
  if (t.dataset.act === "ctpPlein") { carteTpPleinEcran(); return; }
  if (t.id === "ctpPdf") { carteTpPdf(t); return; }
  if (t.dataset.act === "goplus") { S.tab = "plus"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "goamz") { S.tab = "amazon"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "goreg") { S.tab = "reglages"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.act === "soon") { toast((t.dataset.n || "Cette section") + " : prévu dans une prochaine version"); return; }
  if (t.dataset.act === "pitem") {
    const v = computeView(); const P = v.perso && v.perso[S.who]; const e = P && P.entrees[Number(t.dataset.i)]; if (!e) return;
    if (confirm("Supprimer « " + e.lib + " » (" + eur(e.mont) + ") de l'onglet " + S.who + " ?")) {
      const pend = e.pending && S.queue.findIndex(o => o.id === e.pending);
      if (e.pending && pend >= 0) { S.queue.splice(pend, 1); saveQueue(); render(); setSync(); }
      else enqueue("del", { qui: S.who, lib: e.lib, mont: e.mont, cat: e.cat, date: todayISO(), ldds: false });
    }
    return;
  }
  if (t.dataset.act === "amz") {
    const on = !t.classList.contains("on"), prix = Number(t.dataset.prix) || 0;
    enqueue("amazon", { bloc: t.dataset.bloc, groupe: t.dataset.g, lib: t.dataset.lib, prix, mont: on ? prix : 0 }); return;
  }
  if (t.dataset.act === "amzedit") { openAmzItem(t.dataset.g, t.dataset.lib, Number(t.dataset.prix) || 0); return; }
  if (t.dataset.act === "amzadd") { openAmzItem(t.dataset.g, "", 0); return; }
  if (t.dataset.act === "amzjour") { openAmzJour(t.dataset.bloc); return; }
  if (t.id === "aSave") { saveAmzItem(); return; }
  if (t.id === "aDel") { if (confirm("Retirer cet article de la liste Amazon ?")) { enqueue("amazon", { groupe: S.form.g, lib: S.form.lib, suppr: true }); closeSheet(); } return; }
  if (t.id === "jSave") {
    const j = parseInt($("#jJ").value, 10);
    if (!(j >= 1 && j <= 31)) { toast("Indique un jour entre 1 et 31"); return; }
    enqueue("amazon", { bloc: S.form.bloc, jour: j }); closeSheet(); toast("✔ Jour de débit enregistré"); return;
  }
  if (t.id === "fab") { S.edit = null; openAdd(); return; }
  if (t.id === "refresh") { if (S.queue.length) flush(); else { S.frais = true; refresh(); } return; }   // v1.26 : ⟳ = relire le Sheet sans le cache
  if (t.id === "fSave") { saveForm(); return; }
  if (t.id === "fDel") { if (confirm("Supprimer cette dépense ?")) deleteItem(S.edit); return; }
  if (t.dataset.cat) {
    if (t.dataset.cat === "Véhicule" && !S.edit) { openFuel(); return; }
    S.form.cat = t.dataset.cat; S.form.manualCat = true; updateAuto(); return;
  }
  if (t.id === "fFuelBtn") { openFuel(); return; }
  if (t.id === "scanBtn") { S.finCourses = null; $("#scanFile").click(); return; }
  if (t.id === "tSave") { saveTicket(); return; }
  if (t.dataset.tcat) { S.form.cat = t.dataset.tcat; document.querySelectorAll("#tCats .cat").forEach(b => b.classList.toggle("on", b.dataset.tcat === S.form.cat)); return; }
  if (t.id === "vBack") { openAdd({ cat: "Véhicule", manualCat: true }); return; }
  if (t.id === "vSave") { saveFuel(); return; }
  if (t.dataset.qui) { S.form.qui = t.dataset.qui; document.querySelectorAll("#vQui .cat").forEach(b => b.classList.toggle("on", b.dataset.qui === S.form.qui)); return; }
  if (t.dataset.type) { S.form.type = t.dataset.type; document.querySelectorAll("#vType .cat").forEach(b => b.classList.toggle("on", b.dataset.type === S.form.type)); return; }
  if (t.dataset.act === "fuel") { openFuel(); return; }
  if (t.dataset.act === "ldds") { openLdds(); return; }
  if (t.id === "lSave") {
    const m = parseFloat(String($("#lMont").value).replace(/\s/g, "").replace(",", "."));
    if (isNaN(m)) { toast("Indique un montant"); return; }
    enqueue("ldds", { mont: Math.round(m * 100) / 100 }); closeSheet(); toast("✔ Solde LDDS mis à jour"); return;
  }
  if (t.id === "cfgSave") { saveCfgFromForm(); return; }
  if (t.id === "cfgReload") { reloadApp(); return; }
  if (t.dataset.act === "solde") { openSolde(); return; }
  if (t.id === "soldeSave") {
    const m = parseFloat(String($("#sMont").value).replace(/\s/g, "").replace(",", "."));
    if (isNaN(m)) { toast("Indique un montant"); return; }
    enqueue("solde", { mont: Math.round(m * 100) / 100 }); closeSheet(); toast("✔ Solde réel mis à jour"); return;
  }
  if (t.dataset.act === "item") {
    const v = computeView(); const j = v.journal[Number(t.dataset.i)]; if (!j) return;
    S.edit = j; openAdd({ text: j.lib, mont: String(j.mont).replace(".", ","), cat: j.cat, manualCat: true, ldds: j.ldds, date: j.date }); return;
  }
  if (t.dataset.act === "annuel") {
    const paye = !t.querySelector(".tg").classList.contains("on");
    enqueue("annuel", { row: Number(t.dataset.row), lib: t.dataset.lib, mont: Number(t.dataset.mont), paye });
    return;
  }
});
document.addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); if (e.target.id === "fLdds") { S.form.ldds = !S.form.ldds; e.target.classList.toggle("on", S.form.ldds); } if (e.target.id === "fPart") { S.form.partage = !S.form.partage; e.target.classList.toggle("on", S.form.partage); const d = $("#fPartDet"); if (d) { d.style.display = S.form.partage ? "" : "none"; majPartage(); } } if (e.target.id === "aC" || e.target.id === "aS") e.target.classList.toggle("on");
  if (e.target.id === "sNR") { S.form.nonremb = !S.form.nonremb; e.target.classList.toggle("on", S.form.nonremb); ["sS", "sA"].forEach(i => { const x = $("#" + i); if (x) { x.disabled = S.form.nonremb; if (S.form.nonremb) x.value = ""; } }); }
  if (e.target.id === "sDep") { S.form.depense = !S.form.depense; e.target.classList.toggle("on", S.form.depense); } });
document.addEventListener("input", e => {
  if (S.form && S.form.vmode === "soind") { if (e.target.id === "dNote") S.form.note = e.target.value; return; }
  if (!S.form || S.form.vmode === "amz" || S.form.vmode === "amzj") return;
  if (S.form.vmode === "soin" || S.form.vmode === "entree") { handleFormInput(e); return; }
  if (e.target.id === "fText") { S.form.text = e.target.value; updateAuto(); majPartage(); }
  if (e.target.id === "fMont") { S.form.mont = e.target.value; majPartage(); }
  if (e.target.id === "fPartLibre") { S.form.partLibre = e.target.value; const c = partageCalc(), b = document.querySelectorAll("#fPartDet .parts b"); if (b.length === 2) { b[0].textContent = eur(c.pPaye); b[1].textContent = eur(c.pAutre); } }
  if (e.target.id === "fDate") S.form.date = e.target.value;
  const tk = { tM: "magasin", tD: "date", tT: "total" }[e.target.id];
  if (tk) { S.form[tk] = e.target.value; return; }
  const fk = { vL: "litres", vP: "prix", vQ: "prixL", vK: "km" }[e.target.id];
  if (fk) { S.form[fk] = e.target.value; updateFuelCalc(); }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.closest || !e.target.closest("#sheet") || e.target.tagName !== "INPUT") return;
  const b = $("#sheet .btn:not(.sec)"); if (b) { e.preventDefault(); b.click(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "scanFile") { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) S.finCourses = null; scanTicket(f); }
});

async function saveCfgFromForm() {
  S.cfg.url = $("#cfgUrl").value.trim(); S.cfg.key = $("#cfgKey").value.trim(); saveCfg();
  if (!configured()) { toast("Renseigne l'adresse et le code"); return; }
  try {
    const r = await call("state");
    if (r.ok) { S.base = r.state; saveBase(); S.offline = false; S.error = ""; toast("✔ Connecté au Sheet"); S.tab = "home"; }
    else toast("⚠ " + r.error);
  } catch (e) { toast("Impossible de joindre le script : vérifie l'adresse"); }
  setSync(); render();
}
async function reloadApp() {
  try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); const ks = await caches.keys(); for (const k of ks) await caches.delete(k); } catch (e) {}
  location.reload();
}

// ---------- démarrage ----------
(function init() {
  // lien de configuration : #u=<url>&k=<code>
  if (location.hash.length > 2) {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get("u") && p.get("k")) { const nouv = p.get("k") !== S.cfg.key; S.cfg = { url: p.get("u"), key: p.get("k") }; saveCfg(); if (nouv) { S.base = null; saveBase(); } history.replaceState(null, "", location.pathname); toast("Connexion configurée"); }
  }
  majProf(); setSync(); render();
  try { fbDemarrer(); } catch (e) {}   // v1.28 : courses en direct, si l'interrupteur est allumé
  // v1.30 : on laisse 3 s à Firebase pour livrer l'écran tout prêt avant d'interroger le Sheet
  // (seulement sur un téléphone déjà connecté à Firebase ; sinon, comme avant, tout de suite)
  if (configured()) { S.queue.length ? flush() : LS.get("bf.fbProfil", "") ? setTimeout(() => { if (!fbEtatFrais()) refresh(true); }, 3000) : refresh(true); }
  window.addEventListener("online", () => { S.offline = false; flush(); refresh(true); });
  window.addEventListener("offline", () => { S.offline = true; setSync(); });
  // v1.30 : si l'écran arrive déjà tout prêt par Firebase, on n'interroge plus le Sheet (seulement nos saisies à envoyer)
  document.addEventListener("visibilitychange", () => { if (!document.hidden && configured()) { S.queue.length ? flush() : fbEtatFrais() ? null : refresh(true); } });
  setInterval(() => { if (!document.hidden && configured() && navigator.onLine) { S.queue.length ? flush() : fbEtatFrais() ? null : refresh(true); } }, 90000);
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
})();
</script>
